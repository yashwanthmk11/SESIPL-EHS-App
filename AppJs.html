<script>
  const TOKEN_KEY = "sesipl_ehs_token";
  let TOKEN = sessionStorage.getItem(TOKEN_KEY) || "";
  let USER = null;
  let STATE = null;
  let VIEW = "dashboard";
  let MODULE = null;
  let CHARTS = [];
  let MUTATION_IN_FLIGHT = false;
  const MUTATING_CALLS = new Set([
    "apiSubmitForm", "apiReview", "apiAddComment", "apiDeleteComment", "apiDeleteSubmission",
    "apiDeleteUploadedFile",
    "apiSaveDailyLog", "apiSavePpe", "apiSaveScaffold", "apiSaveMovement",
    "apiSaveObservation", "apiCloseObservation", "apiSaveTraining", "apiUploadMeta",
    "apiSaveUser", "apiCreateProject", "apiUpdateProject", "apiDeleteProject", "apiDeleteTraining",
    "apiSaveAuditSchedule", "apiSendAuditReminders", "apiSaveChecklistRevision",
    "apiSendTrainingReminder", "apiSaveTrainingMaterial"
  ]);

  function hideModal() {
    const m = document.getElementById("modal");
    if (m) m.hidden = true;
  }
  function closeModal() {
    hideModal();
  }
  window.hideModal = hideModal;
  window.closeModal = closeModal;

  const ROLE_LABEL = {
    EHS_LEAD: "EHS Lead",
    ASST_EHS_MANAGER: "Asst EHS Manager",
    EHS_MANAGER: "EHS Manager",
    DIRECTOR: "Director",
  };

  function run(fn, ...args) {
    const isMutation = MUTATING_CALLS.has(fn);
    if (isMutation && MUTATION_IN_FLIGHT) {
      return Promise.reject(new Error("Please wait for the current action to finish."));
    }
    if (isMutation) {
      MUTATION_IN_FLIGHT = true;
      setLoading(true, "Saving securely...");
    }
    return new Promise((resolve, reject) => {
      const runner = google.script.run
        .withSuccessHandler((value) => {
          if (isMutation) finishMutation();
          if (value === null || value === undefined) {
            reject(new Error("Server returned an empty response for " + fn + ". Please verify Google Apps Script authorization or reload."));
            return;
          }
          resolve(value);
        })
        .withFailureHandler((error) => {
          if (isMutation) finishMutation();
          const msg = (error && error.message) ? error.message : (typeof error === "string" ? error : "Operation failed on server.");
          reject(new Error(msg));
        });

      if (!runner || typeof runner[fn] !== "function") {
        if (isMutation) finishMutation();
        reject(new Error(
          "Server function '" + fn + "' not found on google.script.run. Please ensure Api.gs has been updated and saved in your Google Apps Script editor, and deploy a new version (Deploy > Manage deployments > Edit > New version > Deploy)."
        ));
        return;
      }

      runner[fn](...args);
    });
  }

  function finishMutation() {
    MUTATION_IN_FLIGHT = false;
    setLoading(false);
  }

  function setLoading(active, label) {
    const state = $("loading-state");
    if (!state) return;
    if (label) $("loading-label").textContent = label;
    state.hidden = !active;
    document.querySelectorAll("button").forEach((button) => {
      if (active) {
        button.dataset.wasDisabled = button.disabled ? "true" : "false";
        button.disabled = true;
      } else if (button.dataset.wasDisabled) {
        button.disabled = button.dataset.wasDisabled === "true";
        delete button.dataset.wasDisabled;
      }
    });
  }

  function $(id) { return document.getElementById(id); }

  /* =========================================================
     MODERN TOAST NOTIFICATION ENGINE
     ========================================================= */
  function showToast(msg, type, duration, isHtml) {
    if (!msg) return;
    const text = typeof msg === "string" ? msg : (msg && msg.message ? msg.message : String(msg));
    const container = $("toast-container") || createToastContainer_();

    // Auto-detect type if not explicitly supplied
    let toastType = (type || "").toLowerCase();
    const lower = text.toLowerCase();
    if (!toastType || !["success", "error", "warning", "info"].includes(toastType)) {
      if (lower.includes("fail") || lower.includes("error") || lower.includes("denied") || lower.includes("mandatory") || lower.includes("not found")) {
        toastType = "error";
      } else if (lower.includes("success") || lower.includes("saved") || lower.includes("submitted") || lower.includes("created") || lower.includes("deleted") || lower.includes("updated")) {
        toastType = "success";
      } else if (lower.includes("select") || lower.includes("warning") || lower.includes("required") || lower.includes("please")) {
        toastType = "warning";
      } else {
        toastType = "info";
      }
    }

    const icons = {
      success: "✓",
      error: "✕",
      warning: "⚠️",
      info: "ℹ️"
    };

    const titles = {
      success: "Success",
      error: "Notice",
      warning: "Attention Required",
      info: "Notification"
    };

    const toastDur = duration || (toastType === "error" ? 5000 : 3800);
    const toastId = "toast-" + Date.now() + "-" + Math.floor(Math.random() * 10000);

    const hasHtml = isHtml === true || (typeof text === "string" && (/<[a-z][\s\S]*>/i.test(text)));

    const item = document.createElement("div");
    item.className = "toast-item " + toastType;
    item.id = toastId;

    item.innerHTML =
      '<div class="toast-icon-wrap">' + (icons[toastType] || "ℹ️") + '</div>' +
      '<div class="toast-body">' +
        '<div class="toast-title">' + (titles[toastType] || "Notice") + '</div>' +
        '<div class="toast-desc">' + (hasHtml ? text : esc(text)) + '</div>' +
      '</div>' +
      '<button type="button" class="toast-close-btn" aria-label="Close" onclick="dismissToast(\'' + toastId + '\')">&times;</button>' +
      '<div class="toast-progress" style="animation-duration:' + toastDur + 'ms"></div>';

    container.appendChild(item);

    const timer = setTimeout(() => {
      dismissToast(toastId);
    }, toastDur);

    item._timer = timer;
    return item;
  }

  function dismissToast(id) {
    const item = typeof id === "string" ? $(id) : id;
    if (!item || item.classList.contains("dismissing")) return;
    if (item._timer) clearTimeout(item._timer);
    item.classList.add("dismissing");
    setTimeout(() => {
      try { item.remove(); } catch (_) {}
    }, 280);
  }

  function createToastContainer_() {
    let c = $("toast-container");
    if (!c) {
      c = document.createElement("div");
      c.id = "toast-container";
      c.className = "toast-container";
      c.setAttribute("aria-live", "polite");
      document.body.appendChild(c);
    }
    return c;
  }

  window.showToast = showToast;
  window.toast = showToast;
  window.dismissToast = dismissToast;

  // Intercept window.alert so all popups seamlessly render as rich modern toasts!
  window.alert = function(msg) {
    showToast(msg);
  };

  function displayDate(value) {
    const text = String(value == null ? "" : value).trim();
    const match = text.match(/^(\d{4})-(\d{2})-(\d{2})(.*)$/);
    return match ? match[3] + "/" + match[2] + "/" + match[1] + match[4] : text;
  }

  function toggleUanVisibility() {
    const input = $("uan");
    const icon = $("uan-eye-icon");
    const btn = $("uan-toggle-btn");
    if (!input || !icon) return;
    const isPassword = input.type === "password";
    input.type = isPassword ? "text" : "password";
    const label = isPassword ? "Hide UAN" : "Show UAN";
    btn.setAttribute("aria-label", label);
    btn.title = label;
    if (isPassword) {
      icon.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
    } else {
      icon.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    }
    input.focus();
  }

  function openLoginHelp() {
    showModal(`
      <div class="login-help-dialog">
        <h3>Sign In Assistance</h3>
        <p class="muted" style="margin-bottom:16px;">Follow these guidelines to access your SESIPL EHS portal account:</p>
        <div class="login-help-step">
          <div class="login-help-badge">1</div>
          <div class="login-help-desc">
            <strong>Employee ID:</strong> Your assigned company ID code (e.g. <code>EMP001</code>, <code>EMP002</code>).
          </div>
        </div>
        <div class="login-help-step">
          <div class="login-help-badge">2</div>
          <div class="login-help-desc">
            <strong>UAN (PIN / Password):</strong> Your registered Universal Account Number credential as recorded in the master system.
          </div>
        </div>
        <div class="login-help-step">
          <div class="login-help-badge">3</div>
          <div class="login-help-desc">
            <strong>Need Account Activation?</strong> If you cannot sign in or your account is inactive, please contact your site EHS Manager or Administrator.
          </div>
        </div>
        <div style="margin-top:20px; text-align:right;">
          <button class="btn secondary small" onclick="hideModal()">Got it</button>
        </div>
      </div>
    `);
  }

  function initLoginCard() {
    const empInput = $("empId");
    const uanInput = $("uan");
    const rememberCheck = $("remember-emp-id");
    const savedEmp = localStorage.getItem("sesipl_remember_emp_id");

    if (savedEmp && empInput) {
      empInput.value = savedEmp;
      if (rememberCheck) rememberCheck.checked = true;
      if (uanInput && !$("login-screen").hidden) {
        setTimeout(() => uanInput.focus(), 150);
      }
    } else if (empInput && !$("login-screen").hidden) {
      setTimeout(() => empInput.focus(), 150);
    }

    if (empInput && !empInput.dataset.bound) {
      empInput.dataset.bound = "true";
      empInput.addEventListener("input", () => {
        empInput.value = empInput.value.toUpperCase();
      });
    }

    if (uanInput && !uanInput.dataset.bound) {
      uanInput.dataset.bound = "true";
      const checkCaps = (e) => {
        const warning = $("caps-warning");
        if (!warning) return;
        if (e.getModifierState && e.getModifierState("CapsLock")) {
          warning.hidden = false;
        } else {
          warning.hidden = true;
        }
      };
      uanInput.addEventListener("keyup", checkCaps);
      uanInput.addEventListener("keydown", checkCaps);
      uanInput.addEventListener("blur", () => {
        const warning = $("caps-warning");
        if (warning) warning.hidden = true;
      });
    }
  }

  async function doLogin(e) {
    if (e) e.preventDefault();
    const empIdEl = $("empId");
    const uanEl = $("uan");
    const errEl = $("login-err");
    const errTextEl = $("login-err-text");
    const btn = $("login-btn");
    const spinner = $("login-btn-spinner");
    const btnText = $("login-btn-text");
    const card = $("main-login-card") || document.querySelector(".login-card");

    if (errEl) errEl.hidden = true;

    const empId = (empIdEl ? empIdEl.value : "").trim();
    const uan = (uanEl ? uanEl.value : "").trim();

    if (!empId || !uan) {
      if (card) {
        card.classList.remove("shake");
        void card.offsetWidth;
        card.classList.add("shake");
      }
      if (errTextEl) errTextEl.textContent = "Please enter both Employee ID and UAN.";
      if (errEl) errEl.hidden = false;
      if (!empId && empIdEl) empIdEl.focus();
      else if (uanEl) uanEl.focus();
      return false;
    }

    btn.disabled = true;
    if (spinner) spinner.hidden = false;
    if (btnText) btnText.textContent = "Authenticating...";

    try {
      const res = await run("login", empId, uan);
      if (!res.ok) throw new Error(res.error || "Authentication failed.");

      const rememberCheck = $("remember-emp-id");
      if (rememberCheck && rememberCheck.checked) {
        localStorage.setItem("sesipl_remember_emp_id", empId);
      } else {
        localStorage.removeItem("sesipl_remember_emp_id");
      }

      TOKEN = res.token;
      sessionStorage.setItem(TOKEN_KEY, TOKEN);
      USER = res.user;
      VIEW = "dashboard";
      if (btnText) btnText.textContent = "Entering Portal...";
      await boot();
    } catch (err) {
      if (card) {
        card.classList.remove("shake");
        void card.offsetWidth;
        card.classList.add("shake");
      }
      if (errTextEl) errTextEl.textContent = err.message || String(err);
      if (errEl) errEl.hidden = false;
      if (uanEl) {
        uanEl.focus();
        uanEl.select();
      }
    } finally {
      btn.disabled = false;
      if (spinner) spinner.hidden = true;
      if (btnText) btnText.textContent = "Sign In to Portal";
    }
    return false;
  }

  async function doLogout() {
    try {
      await run("logout", TOKEN);
    } catch (e) {}
    TOKEN = "";
    USER = null;
    STATE = null;
    VIEW = "dashboard";
    sessionStorage.removeItem(TOKEN_KEY);
    $("app-screen").hidden = true;
    $("login-screen").hidden = false;
    if ($("uan")) $("uan").value = "";
    initLoginCard();
  }

  async function boot() {
    VIEW = "dashboard";
    const bootRes = await run("apiBootstrap", TOKEN);
    if (!bootRes || !bootRes.ok || !bootRes.data) {
      const msg = (bootRes && bootRes.error) ? bootRes.error : "Failed to load dashboard data. Please try again.";
      await doLogout();
      throw new Error(msg);
    }
    STATE = bootRes.data;
    USER = bootRes.user || USER;
    if (STATE && STATE.notifications) {
      const dismissed = getDismissedNotifIds();
      STATE.notifications = STATE.notifications.filter(n => !dismissed.has(n.id) && String(n.dismissed || '').toUpperCase() !== 'TRUE');
    }
    $("login-screen").hidden = true;
    $("app-screen").hidden = false;
    $("who-name").textContent = USER.name;
    $("side-role").textContent = ROLE_LABEL[USER.role] || USER.role;
    fillProjects();
    buildNav();
    render();
  }

  function canUploadRole() {
    return USER && (USER.role === "EHS_LEAD" || USER.role === "ASST_EHS_MANAGER");
  }
  window.canUploadRole = canUploadRole;

  function canApproveRole() {
    return USER && (USER.role === "ASST_EHS_MANAGER" || USER.role === "EHS_MANAGER" || USER.role === "DIRECTOR");
  }
  window.canApproveRole = canApproveRole;

  function canViewChartsRole() {
    return USER && (USER.role === "DIRECTOR" || USER.role === "EHS_MANAGER");
  }
  window.canViewChartsRole = canViewChartsRole;

  function canCommentRole() {
    return !!USER;
  }
  window.canCommentRole = canCommentRole;

  function canManageProjects() {
    return USER && (USER.role === "DIRECTOR" || USER.role === "EHS_MANAGER");
  }
  window.canManageProjects = canManageProjects;

  function fillProjects() {
    const sel = $("project-select");
    if (!sel) return;
    const prevVal = sel.value;
    sel.innerHTML = "";

    let projs = STATE.projects || [];
    if (USER && USER.role === "EHS_LEAD") {
      const mapped = USER.mappedProjects || [];
      if (mapped.length) {
        projs = projs.filter((p) => mapped.includes(p.id));
      } else if (STATE.selectedProjectId) {
        projs = projs.filter((p) => p.id === STATE.selectedProjectId);
      }
      if (!projs.length && STATE.projects && STATE.projects.length) {
        projs = [STATE.projects[0]];
      }
    }

    projs.forEach((p) => {
      const o = document.createElement("option");
      o.value = p.id;
      o.textContent = (p.code || "PRJ") + " — " + (p.name || "Untitled");
      sel.appendChild(o);
    });

    if (USER && USER.role === "EHS_LEAD") {
      sel.disabled = true;
      if (projs.length) {
        sel.value = projs[0].id;
      }
    } else {
      sel.disabled = false;
      if (USER && (USER.role === "EHS_MANAGER" || USER.role === "DIRECTOR")) {
        const all = document.createElement("option");
        all.value = "";
        all.textContent = "All running projects";
        sel.insertBefore(all, sel.firstChild);
      }
      if (prevVal && Array.from(sel.options).some((o) => o.value === prevVal)) {
        sel.value = prevVal;
      } else if (sel.options.length > 0) {
        sel.selectedIndex = 0;
      }
    }
    sel.onchange = () => render();
  }

  function currentProjectId() {
    if (USER && USER.role === "EHS_LEAD") {
      const mapped = (USER.mappedProjects && USER.mappedProjects[0]) || STATE.selectedProjectId;
      if (mapped) return mapped;
      if (STATE.projects && STATE.projects.length) return STATE.projects[0].id;
    }
    const sel = $("project-select");
    return sel ? sel.value : "";
  }

  function currentProject() {
    const id = currentProjectId();
    const p = (STATE.projects || []).find((pr) => pr.id === id);
    if (p) return p;
    if (USER && USER.role === "EHS_LEAD" && STATE.projects && STATE.projects.length) {
      return STATE.projects[0];
    }
    return null;
  }

  function scopedSubs() {
    const id = currentProjectId();
    if (USER && USER.role === "EHS_LEAD") {
      return (STATE.submissions || []).filter((s) => s.projectId === id);
    }
    return (STATE.submissions || []).filter((s) => !id || s.projectId === id);
  }

  function buildNav() {
    const isUp = canUploadRole();
    const items = [
      ["dashboard", "Dashboard"]
    ];
    if (canApproveRole()) {
      items.push(["inbox", "Approvals"]);
    }
    items.push(
      ["daily", isUp ? "Daily uploads" : "Daily Checklists"],
      ["weekly", isUp ? "Weekly / Monthly" : "Weekly Reports"],
      ["permits", "Work permits"],
      ["onetime", isUp ? "One-time docs" : "Compliance Docs"],
      ["observations", "Observations"],
      ["audits", "EHS Audits"],
      ["documents", "PDF library"],
      ["dailylog", "Daily log"],
      ["trackers", "PPE / Scaffold"],
      ["gallery", "Gallery"],
      ["library", "eLibrary"],
      ["calendar", "Training calendar"]
    );
    if (canManageProjects())
      items.push(["projects", "Projects"]);
    if (USER.role === "EHS_MANAGER" || USER.role === "DIRECTOR")
      items.push(["users", "Users"]);
    $("nav").innerHTML = items
      .map(
        ([id, label]) =>
          '<button data-view="' +
          id +
          '" onclick="go(\'' +
          id +
          "')\">" +
          label +
          "</button>",
      )
      .join("");
  }

  function go(view) {
    VIEW = view;
    try { window.scrollTo(0, 0); } catch (_) {}
    render();
  }

  function destroyCharts() {
    CHARTS.forEach((c) => {
      try {
        c.destroy();
      } catch (e) {}
    });
    CHARTS = [];
  }

  function render() {
    destroyCharts();
    document
      .querySelectorAll("#nav button")
      .forEach((b) =>
        b.classList.toggle("active", b.getAttribute("data-view") === VIEW),
      );
    const unread = (STATE.notifications || []).filter(
      (n) => String(n.read) !== "TRUE",
    ).length;
    $("badge-n").textContent = unread;
    const map = {
      dashboard: renderDashboard,
      projects: renderProjects,
      inbox: renderInbox,
      daily: () =>
        renderModuleForms(["CHECKLIST"], "Daily / weekly checklists"),
      weekly: () => renderModuleForms(["WEEKLY"], "Weekly & monthly reports"),
      permits: () => renderModuleForms(["PERMIT"], "Work permits"),
      onetime: () =>
        renderModuleForms(
          ["TEST_CERT", "EHS_DOCS", "LEGAL", "POLICY", "SWMS"],
          "One-time project documents (Assistant Manager uploads; Lead view only)",
        ),
      observations: renderObservations,
      audits: renderAudits,
      documents: renderDocuments,
      dailylog: renderDailyLog,
      trackers: renderTrackers,
      gallery: renderGallery,
      library: renderLibrary,
      calendar: renderCalendar,
      users: renderUsers,
    };
    (map[VIEW] || renderDashboard)();
  }

  function renderDashboard() {
    const pid = currentProjectId();
    const proj = currentProject();
    const role = USER.role;
    $("page-title").textContent =
      role === "DIRECTOR"
        ? "Director overview"
        : role === "EHS_MANAGER"
          ? "All projects monitor"
          : role === "ASST_EHS_MANAGER"
            ? proj
              ? proj.name + " overview"
              : "Select a project"
            : proj
              ? proj.name
              : "My site";
    $("page-sub").textContent =
      "Employee " + USER.employeeId + " · " + (ROLE_LABEL[role] || role);

    const stats = STATE.stats;
    const bp = stats.byProject || {};
    const use =
      pid && bp[pid]
        ? bp[pid]
        : {
            pending: stats.pendingApprovals,
            approved: stats.approved,
            rejected: stats.rejected,
            openObs: stats.openObservations,
            manHours: stats.manHours,
            compliance: avg(Object.keys(bp).map((k) => bp[k].compliance)),
          };

    if (role === "EHS_LEAD") {
      renderLeadDashboard(proj, use);
      return;
    }
    if (role === "ASST_EHS_MANAGER") {
      renderAssistantDashboard(proj, use);
      return;
    }
    if (role === "EHS_MANAGER") {
      renderManagerDashboard(stats, bp);
      return;
    }
    if (role === "DIRECTOR") {
      renderDirectorDashboard(stats, bp);
      return;
    }

    $("view").innerHTML =
      '<div class="grid kpi">' +
      kpi(use.pending, "Pending approvals") +
      kpi(use.approved, "Approved PDFs") +
      kpi(use.rejected, "Returned to lead") +
      kpi(use.openObs, "Open observations") +
      kpi(use.manHours, "Man hours") +
      kpi((use.compliance || 0) + "%", "Compliance") +
      "</div>" +
      roleDashboardPanel(role, proj, stats) +
      '<div class="charts" style="margin-top:14px">' +
      '<div class="card"><canvas id="c1"></canvas></div>' +
      '<div class="card"><canvas id="c2"></canvas></div>' +
      "</div>" +
      '<div class="grid mods" style="margin-top:14px">' +
      STATE.modules
        .map(
          (m) =>
            '<div class="card mod" onclick="openModule(\'' +
            m.id +
            '\')"><div class="pill">' +
            m.cadence +
            '</div><h3 style="margin:8px 0 4px">' +
            m.title +
            '</h3><p class="muted">Open forms & PDFs</p></div>',
        )
        .join("") +
      "</div>" +
      (proj
        ? '<div class="card" style="margin-top:14px">' +
          projectInfo(proj) +
          "</div>"
        : projectTable()) +
      '<div class="card" style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn small" onclick="exportNow(\'pdf\')">Download report PDF</button>' +
      '<button class="btn small secondary" onclick="exportNow(\'xlsx\')">Download Excel</button>' +
      "</div>";

    const labels = Object.keys(bp).map((k) => bp[k].name);
    CHARTS.push(
      new Chart($("c1"), {
        type: "bar",
        data: {
          labels: labels,
          datasets: [
            {
              label: "Approved",
              data: Object.keys(bp).map((k) => bp[k].approved),
              backgroundColor: "#1f7a6b",
            },
            {
              label: "Pending",
              data: Object.keys(bp).map((k) => bp[k].pending),
              backgroundColor: "#e8b931",
            },
            {
              label: "Rejected",
              data: Object.keys(bp).map((k) => bp[k].rejected),
              backgroundColor: "#b42318",
            },
          ],

  function directorScorecardTable(projects, bp) {
    if (!projects.length) return '<p class="muted">No projects found for this region filter.</p>';
    let sumManpower = 0, sumSafeHours = 0, sumCumSafe = 0, sumPending = 0, sumOpen = 0, sumPermits = 0;
    const rows = projects.map((p) => {
      const s = bp[p.id] || {};
      const mp = Number(s.totalManpower || 0);
      const sh = Number(s.safeManHours || 0);
      const csh = Number(s.cumSafeManHours || 0);
      const pend = Number(s.pending || 0);
      const op = Number(s.openObs || 0);
      const perm = Number(s.permitTotal || 0);
      const comp = Number(s.compliance || 0);

    if (id === "CHECKLIST") {
      VIEW = "daily";
      render();
      return;
    }
    if (id === "WEEKLY") {
      VIEW = "weekly";
      render();
      return;
    }
    if (id === "PERMIT") {
      VIEW = "permits";
      render();
      return;
    }
    VIEW = "onetime";
    render();
  }

  function openBulkUpload(formCode) {
    if (!currentProjectId()) { alert("Select a project first."); return; }
    const def = STATE.catalog.find((form) => form.formCode === formCode);
    showModal('<button class="modal-close" type="button" aria-label="Close" onclick="hideModal()">×</button>' +
      '<h3>' + esc(def.title) + '</h3><p class="muted">Select one or more PDF files. Each filename becomes the document title.</p>' +
      '<form id="bulk-upload-form" class="form-grid"><div class="full"><label>PDF documents</label><input id="bulk-files" type="file" accept="application/pdf,.pdf" multiple required></div>' +
      '<div id="bulk-file-list" class="full muted">No files selected.</div>' +
      '<div class="full row-actions"><button class="btn small" type="submit">Upload selected files</button><button type="button" class="ghost" onclick="hideModal()">Cancel</button></div></form>');
    $("bulk-files").onchange = function () {
      const names = Array.from(this.files).map((file) => esc(file.name));
      $("bulk-file-list").innerHTML = names.length ? names.map((name) => '<div class="selected-file">' + name + '</div>').join("") : "No files selected.";
    };
    $("bulk-upload-form").onsubmit = async function (event) {
      event.preventDefault();
      const files = Array.from($("bulk-files").files || []);
      if (!files.length) return;
      try {
        for (const file of files) {
          const b64 = await blobToB64(file);
          const title = file.name.replace(/\.[^.]+$/, "");
          await run("apiUploadMeta", TOKEN, {
            projectId: currentProjectId(),
            kind: "LIBRARY",
            module: def.module,
            moduleTitle: def.title,
            title: title,
            fileName: file.name,
            mimeType: file.type || "application/pdf",
            base64: b64.split(",")[1],
            tags: formCode
          });
        }
        hideModal();
        await refresh();
      } catch (error) {
        alert(error.message || error);
      }
    };
  }

  async function openForm(formCode, submissionId) {
    if (!currentProjectId()) {
      alert("Select a project first.");
      return;
    }
    const meta = await run("apiGetFormMeta", TOKEN, formCode);
    const prev = submissionId
      ? STATE.submissions.find((s) => s.id === submissionId)
      : null;
    const payload =
      prev && prev.payload && typeof prev.payload === "object"
        ? prev.payload
        : {};

    const upload = meta.def.entryType === "UPLOAD";
    const isPermit = formCode.startsWith("WP_");

    if (isPermit) {
      showModal(buildWorkPermitFormModalHtml(meta, payload, currentProject(), upload));
    } else {
      const fields = meta.fields
        .map((f) => {
          const val = payload[f.key] || "";
          let ctrl = "";
          if (f.type === "textarea")
            ctrl =
              '<textarea name="' +
              f.key +
              '" placeholder="Enter ' +
              esc(f.label.toLowerCase()) +
              '" ' +
              (f.required ? "required" : "") +
              ">" +
              esc(val) +
              "</textarea>";
          else if (f.type === "select")
            ctrl =
              '<select name="' +
              f.key +
              '" ' +
              (f.required ? "required" : "") +
              ">" +
              (f.options || [])
                .map(
                  (o) =>
                    "<option " +
                    (o === val ? "selected" : "") +
                    ">" +
                    o +
                    "</option>",
                )
                .join("") +
              "</select>";
          else
            ctrl =
              '<input name="' +
              f.key +
              '" type="' +
              (f.type || "text") +
              '" lang="en-GB' +
              '" value="' +
              esc(val) +
              '" placeholder="Enter ' +
              esc(f.label.toLowerCase()) +
              '" ' +
              (f.required ? "required" : "") +
              ">";
          return (
            '<div class="' +
            (f.type === "textarea" ? "full" : "") +
            '"><label>' +
            esc(f.label) +
            "</label>" +
            ctrl +
            "</div>"
          );
        })
        .join("");

      showModal(
        "<h3>" +
          esc(meta.def.title) +
          '</h3><p class="muted">' +
          esc(currentProject().name) +
          "</p>" +
          '<form id="dyn-form" class="form-grid">' +
          fields +
          (upload
            ? '<div class="full"><label>File</label><input type="file" id="up-file"></div>'
            : "") +
          '<div class="full" style="display:flex;gap:8px"><button class="btn small" type="submit">Submit for approval</button><button type="button" class="ghost" onclick="hideModal()">Cancel</button></div></form>',
      );
    }
    $("dyn-form").onsubmit = async function (ev) {
      ev.preventDefault();
      const fd = new FormData(this);
      const obj = {};
      fd.forEach((v, k) => (obj[k] = v));
      const fileEl = $("up-file");
      try {
        if (fileEl && fileEl.files[0]) {
          const file = fileEl.files[0];
          const b64 = await blobToB64(file);
          await run("apiUploadMeta", TOKEN, {
            projectId: currentProjectId(),
            kind: "LIBRARY",
            module: meta.def.module,
            moduleTitle: (
              STATE.modules.find((m) => m.id === meta.def.module) || {}
            ).title,
            title: obj.title || file.name,
            fileName: file.name,
            mimeType: file.type || "application/pdf",
            base64: b64.split(",")[1],
            tags: meta.def.formCode,
          });
        }
        const signedFileEl = $("wp-signed-file");
        if (signedFileEl && signedFileEl.files && signedFileEl.files[0]) {
          const sf = signedFileEl.files[0];
          const b64 = await blobToB64(sf);
          const upRes = await run("apiUploadMeta", TOKEN, {
            projectId: currentProjectId(),
            kind: "LIBRARY",
            module: "PERMIT",
            moduleTitle: "Work Permit",
            title: "Signed PTW - " + (obj.permitNo || meta.def.title) + " (" + sf.name + ")",
            fileName: sf.name,
            mimeType: sf.type || "application/pdf",
            base64: b64.split(",")[1],
            tags: meta.def.formCode + ",SIGNED_PTW"
          });
          if (upRes && upRes.url) {
            obj.signedPermitUrl = upRes.url;
            obj.signedPermitFile = sf.name;
            obj.signedPermitFileName = sf.name;
          }
        }
        const swmsFileEl = $("wp-swms-file");
        if (swmsFileEl && swmsFileEl.files && swmsFileEl.files[0]) {
          const swf = swmsFileEl.files[0];
          const b64 = await blobToB64(swf);
          const upRes = await run("apiUploadMeta", TOKEN, {
            projectId: currentProjectId(),
            kind: "LIBRARY",
            module: "PERMIT",
            moduleTitle: "Work Permit",
            title: "SWMS Document - " + (obj.permitNo || meta.def.title) + " (" + swf.name + ")",
            fileName: swf.name,
            mimeType: swf.type || "application/pdf",
            base64: b64.split(",")[1],
            tags: meta.def.formCode + ",SWMS"
          });
          if (upRes && upRes.url) {
            obj.swmsFileUrl = upRes.url;
            obj.swmsFile = swf.name;
            obj.swmsFileName = swf.name;
          }
        }
        const photoFileEl = $("wp-photo-file");
        if (photoFileEl && photoFileEl.files && photoFileEl.files[0]) {
          const pf = photoFileEl.files[0];
          const b64 = await blobToB64(pf);
          const upRes = await run("apiUploadMeta", TOKEN, {
            projectId: currentProjectId(),
            kind: "LIBRARY",
            module: "PERMIT",
            moduleTitle: "Work Permit",
            title: "Pre-Work Verification Photo - " + (obj.permitNo || meta.def.title) + " (" + pf.name + ")",
            fileName: pf.name,
            mimeType: pf.type || "image/jpeg",
            base64: b64.split(",")[1],
            tags: meta.def.formCode + ",PRE_WORK_PHOTO"
          });
          if (upRes && upRes.url) {
            obj.preWorkPhotoUrl = upRes.url;
            obj.preWorkPhoto = pf.name;
            obj.preWorkPhotoName = pf.name;
          }
        }
        const res = await run("apiSubmitForm", TOKEN, {
          projectId: currentProjectId(),
          formCode: formCode,
          fields: obj,
          submissionId: submissionId || "",
          requestId: window.crypto && window.crypto.randomUUID ? window.crypto.randomUUID() : "REQ_" + Date.now() + "_" + Math.random().toString(36).slice(2),
        });
        hideModal();
        alert("Submitted. PDF generated and sent up the approval chain.");
        await refresh();
      } catch (err) {
        alert(err.message || err);
      }
    };
  }

    STATE.modules.forEach((module) => { grouped[module.id] = []; });
    scopedSubs().forEach((submission) => {
      if (!grouped[submission.module]) grouped[submission.module] = [];
      grouped[submission.module].push(submission);
    });
    const isLead = USER && USER.role === "EHS_LEAD";
    (STATE.library || []).filter((file) => isLead ? (file.projectId === projectId || file.projectId === "*") : (!projectId || file.projectId === projectId || file.projectId === "*")).forEach((file) => {

  function renderDailyLog() {
    $("page-title").textContent = "Daily Log Sheet (Slide 8 Standard)";
    $("page-sub").textContent =
      "Consolidated daily performance report: Manpower, Safe Hours, Safety Inductions, TBT, Permits, and Zero-Harm Accident Statistics.";
    const pId = currentProjectId();
    const isLead = USER && USER.role === "EHS_LEAD";
    const rows = (STATE.dailyLog || []).filter(
      (r) => isLead ? (r.projectId === pId) : (!pId || r.projectId === pId),
    );

    // Sums for active project scope
    const totalStaff = rows.reduce((a, r) => a + Number(r.staff || 0), 0);
    const totalWorkers = rows.reduce((a, r) => a + Number(r.workers || 0), 0);

  function printHtmlViaIframe_(html) {
    let frame = $("sesipl-print-frame");
    if (!frame) {
      frame = document.createElement("iframe");
      frame.id = "sesipl-print-frame";
      frame.style.position = "fixed";
      frame.style.right = "0";
      frame.style.bottom = "0";
      frame.style.width = "0";
      frame.style.height = "0";
      frame.style.border = "0";
      document.body.appendChild(frame);
    }
    const doc = frame.contentWindow.document;
    doc.open();
    doc.write(html);
    doc.close();
    setTimeout(() => {
      try {
        frame.contentWindow.focus();
        frame.contentWindow.print();
      } catch (err) {
        const w = window.open("", "_blank");
        if (w) {
          w.document.write(html);
          w.document.close();
          w.focus();
          w.print();
        }
      }
    }, 400);
  }

  async function printDailyLogPreview(monthStr) {

    const activeMonth = monthStr || (mInput ? mInput.value : "") || new Date().toISOString().slice(0, 7);

  function printDailyLogHtml_(html) {
    const printWin = window.open("", "_blank");
    if (printWin) {
      printWin.document.open();
      printWin.document.write(html);
      printWin.document.close();
      setTimeout(() => {
        try { printWin.focus(); printWin.print(); } catch (_) {}
      }, 500);
      return;
    }

    let iframe = $("daily-log-print-frame");
    if (!iframe) {
      iframe = document.createElement("iframe");
      iframe.id = "daily-log-print-frame";
      iframe.style.position = "fixed";
      iframe.style.right = "0";
      iframe.style.bottom = "0";
      iframe.style.width = "0";
      iframe.style.height = "0";
      iframe.style.border = "0";
      document.body.appendChild(iframe);
    }
    iframe.contentWindow.document.open();
    iframe.contentWindow.document.write(html);
    iframe.contentWindow.document.close();
    setTimeout(() => {
      try {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
      } catch (err) {
        showToast("Print notice: " + (err.message || err), "error");
      }
    }, 600);
  }

      ev.preventDefault();
      const fd = new FormData(this);
      const row = { projectId: proj.id };
      fd.forEach((v, k) => (row[k] = v));
      row.totalReceived = Number(row.totalReceived || 0);
      row.issuedQty = Number(row.issuedQty || 0);

      if (!STATE.ppe) STATE.ppe = [];

      if (window.TRACKER_TAB === "PPE") {

      '    </div>' +
      '  </form>' +
      '</div>';

    showModal(modalHtml);

    if (f) {
      f.onsubmit = function(ev) {
        ev.preventDefault();

        const prev = fd.get("preventive") || "Corrected and closed";

        renderAudits();

  /* =========================================================
     IMMERSIVE GALLERY LIGHTBOX VIEWER
     ========================================================= */
  let CURRENT_LIGHTBOX_ITEMS = [];
  let CURRENT_LIGHTBOX_INDEX = 0;

  function openGalleryLightbox(mediaId) {
    const pid = currentProjectId();
    const activeFilter = window.GALLERY_FILTER || "ALL";
    const searchQuery = String(window.GALLERY_SEARCH || "").trim().toLowerCase();

    const allScoped = (STATE.gallery || []).filter(
      (g) => !pid || g.projectId === pid,
    );

    CURRENT_LIGHTBOX_ITEMS = allScoped.filter((g) => {
      const matchCat = activeFilter === "ALL" || (g.category || "").toUpperCase() === activeFilter;
      if (!matchCat) return false;
      if (!searchQuery) return true;
      const t = String(g.title || "").toLowerCase();
      const u = String(g.uploadedBy || "").toLowerCase();
      return t.includes(searchQuery) || u.includes(searchQuery);
    });

    if (!CURRENT_LIGHTBOX_ITEMS.length) {
      CURRENT_LIGHTBOX_ITEMS = allScoped;
    }

    const idx = CURRENT_LIGHTBOX_ITEMS.findIndex(g => g.id === mediaId);
    CURRENT_LIGHTBOX_INDEX = idx >= 0 ? idx : 0;

    renderLightboxContent();

    window.addEventListener("keydown", handleLightboxKeydown);
  }
  window.openGalleryLightbox = openGalleryLightbox;

  function closeGalleryLightbox() {
    const lb = $("gal-lightbox-root");
    if (lb) lb.remove();
    window.removeEventListener("keydown", handleLightboxKeydown);
  }
  window.closeGalleryLightbox = closeGalleryLightbox;

  function handleLightboxKeydown(e) {
    if (e.key === "ArrowLeft") {
      e.preventDefault();
      navLightbox(-1);
    } else if (e.key === "ArrowRight") {
      e.preventDefault();
      navLightbox(1);
    } else if (e.key === "Escape") {
      e.preventDefault();
      closeGalleryLightbox();
    }
  }

  function navLightbox(delta) {
    if (!CURRENT_LIGHTBOX_ITEMS.length) return;
    CURRENT_LIGHTBOX_INDEX = (CURRENT_LIGHTBOX_INDEX + delta + CURRENT_LIGHTBOX_ITEMS.length) % CURRENT_LIGHTBOX_ITEMS.length;
    renderLightboxContent();
  }
  window.navLightbox = navLightbox;

  function renderLightboxContent() {
    const g = CURRENT_LIGHTBOX_ITEMS[CURRENT_LIGHTBOX_INDEX];
    if (!g) return;

    let existing = $("gal-lightbox-root");
    if (!existing) {
      existing = document.createElement("div");
      existing.id = "gal-lightbox-root";
      existing.className = "gal-lightbox-backdrop";
      document.body.appendChild(existing);
    }

    const proj = (STATE.projects || []).find(p => p.id === g.projectId);
    const projName = proj ? (proj.name || proj.code) : g.projectId;
    const cat = String(g.category || "EVENT").toUpperCase();
    const isVideo = (g.mimeType && g.mimeType.toLowerCase().includes("video")) || (g.title && g.title.toLowerCase().endsWith(".mp4"));

    let displaySrc = g.thumbUrl;
    if (!displaySrc) {
      if (g.fileId && !String(g.fileId).startsWith("http")) {
        displaySrc = 'https://drive.google.com/thumbnail?id=' + g.fileId + '&sz=w1600';
      } else if (g.url && String(g.url).startsWith("http")) {
        displaySrc = g.url;
      } else if (g.fileId && String(g.fileId).startsWith("http")) {
        displaySrc = g.fileId;
      }
    }

    const canDelete = USER.role === "DIRECTOR" || USER.role === "EHS_MANAGER" || g.uploadedBy === USER.employeeId;

    existing.innerHTML =
      '<div class="gal-lightbox-topbar">' +
        '<div class="gal-lightbox-topbar-left">' +
          '<span class="pill">' + esc(cat) + '</span>' +
          '<span class="gal-lightbox-counter">Photo ' + (CURRENT_LIGHTBOX_INDEX + 1) + ' of ' + CURRENT_LIGHTBOX_ITEMS.length + '</span>' +
        '</div>' +
        '<div class="gal-lightbox-topbar-right">' +
          (g.url ? '<a href="' + esc(g.url) + '" target="_blank" class="gal-lightbox-btn"><span>Open in Drive</span> ↗</a>' : '') +
          (canDelete ? '<button type="button" class="gal-lightbox-btn" style="background:#dc2626;border-color:#ef4444" onclick="delUploadedFile(\'' + esc(g.fileId) + '\');closeGalleryLightbox()">Delete 🗑️</button>' : '') +
          '<button type="button" class="gal-lightbox-close-btn" onclick="closeGalleryLightbox()" aria-label="Close">✕</button>' +
        '</div>' +
      '</div>' +

      '<div class="gal-lightbox-body" onclick="if(event.target===this)closeGalleryLightbox()">' +
        (CURRENT_LIGHTBOX_ITEMS.length > 1 ? '<button type="button" class="gal-lightbox-nav-btn prev" onclick="navLightbox(-1)" aria-label="Previous">❮</button>' : '') +
        (isVideo
          ? '<video src="' + esc(g.url || displaySrc) + '" controls autoplay class="gal-lightbox-media"></video>'
          : '<img src="' + esc(displaySrc) + '" class="gal-lightbox-media" alt="' + esc(g.title) + '" onerror="handleGalleryImgError(this,\'' + esc(cat) + '\')">') +
        (CURRENT_LIGHTBOX_ITEMS.length > 1 ? '<button type="button" class="gal-lightbox-nav-btn next" onclick="navLightbox(1)" aria-label="Next">❯</button>' : '') +
      '</div>' +

      '<div class="gal-lightbox-caption">' +
        '<div>' +
          '<div class="gal-lightbox-caption-title">' + esc(g.title) + '</div>' +
          (projName ? '<div style="font-size:12px;color:#94a3b8;margin-top:2px">📍 ' + esc(projName) + '</div>' : '') +
        '</div>' +
        '<div class="gal-lightbox-caption-meta">' +
          '<span>📅 Uploaded ' + displayDate(g.uploadedAt) + '</span>' +
          '<span>👤 By ' + esc(g.uploadedBy || 'Safety Team') + '</span>' +
        '</div>' +
      '</div>';
  }

    const text = (String(t.topic || "") + " " + String(t.dept || "") + " " + String(t.notes || "")).toLowerCase();
    if (text.includes("loto") || text.includes("lockout") || text.includes("electric") || text.includes("substation") || text.includes("switchgear") || text.includes("panel")) {
      return { id: "ELEC", name: "Electrical & LOTO", icon: "⚡", color: "#b45309", bg: "#fef3c7", border: "#fde68a" };
    }
    if (text.includes("height") || text.includes("fall") || text.includes("harness") || text.includes("scaffold") || text.includes("ladder")) {
      return { id: "HEIGHT", name: "Height & Scaffolding", icon: "🦺", color: "#0369a1", bg: "#e0f2fe", border: "#bae6fd" };
    }
    if (text.includes("fire") || text.includes("evacuat") || text.includes("extinguish") || text.includes("drill") || text.includes("emergency")) {
      return { id: "FIRE", name: "Fire & Emergency", icon: "🧯", color: "#b91c1c", bg: "#fee2e2", border: "#fecaca" };
    }
    if (text.includes("aid") || text.includes("cpr") || text.includes("heat") || text.includes("hygiene") || text.includes("medical") || text.includes("health")) {
      return { id: "HEALTH", name: "First Aid & Health", icon: "🩹", color: "#047857", bg: "#d1fae5", border: "#a7f3d0" };
    }
    if (text.includes("crane") || text.includes("rigging") || text.includes("lift") || text.includes("slings") || text.includes("machin") || text.includes("tool")) {
      return { id: "RIG", name: "Rigging & Tools", icon: "🏗️", color: "#6d28d9", bg: "#ede9fe", border: "#ddd6fe" };
    }
    if (text.includes("confined") || text.includes("gas") || text.includes("oxygen") || text.includes("manhole")) {
      return { id: "CONF", name: "Confined Space", icon: "🕳️", color: "#c2410c", bg: "#ffedd5", border: "#fed7aa" };
    }
    if (text.includes("chemical") || text.includes("msds") || text.includes("spill") || text.includes("acid")) {
      return { id: "CHEM", name: "Chemical Safety", icon: "🧪", color: "#4338ca", bg: "#e0e7ff", border: "#c7d2fe" };

    return { id: "GEN", name: "General Safety", icon: "🎓", color: "#0f766e", bg: "#ccfbf1", border: "#99f6e4" };

  function getDaysUntil(dateStr) {
    if (!dateStr) return "";
    const target = new Date(dateStr.split(" ")[0] + "T00:00:00");
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const diffTime = target - today;
    const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
    if (diffDays === 0) return "Today";
    if (diffDays === 1) return "Tomorrow";
    if (diffDays === -1) return "Yesterday";
    if (diffDays > 1 && diffDays < 7) return "In " + diffDays + " days";
    if (diffDays >= 7 && diffDays < 14) return "Next week";
    if (diffDays < -1) return Math.abs(diffDays) + " days ago";
    return diffDays > 0 ? "In " + diffDays + " days" : "";
  }

    const topbarHtml =
      '<div class="cal-topbar">' +
        '<div class="cal-nav-group">' +
          '<button type="button" class="cal-nav-btn" onclick="navCalendarMonth(-1)">◀ Prev</button>' +
          '<button type="button" class="cal-nav-btn" onclick="navCalendarToday()">Today</button>' +
          '<button type="button" class="cal-nav-btn" onclick="navCalendarMonth(1)">Next ▶</button>' +
          '<div class="cal-month-title">' + monthTitle + '</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
          '<div class="cal-toggle-group">' +
            '<button type="button" class="cal-toggle-btn' + (window.CALENDAR_VIEW === "GRID" ? " active" : "") + '" onclick="window.CALENDAR_VIEW=\'GRID\';renderCalendar()">🗓️ Month Grid</button>' +
            '<button type="button" class="cal-toggle-btn' + (window.CALENDAR_VIEW === "AGENDA" ? " active" : "") + '" onclick="window.CALENDAR_VIEW=\'AGENDA\';renderCalendar()">📋 Agenda Schedule</button>' +
          '</div>' +
          (canManage ? '<button type="button" class="btn small" style="display:inline-flex;align-items:center;gap:6px" onclick="openScheduleTrainingModal()">+ Schedule Training</button>' : '') +
        '</div>' +
      '</div>';

    const categories = [
      { id: "ALL", label: "All Safety Modules" },
      { id: "ELEC", label: "⚡ Electrical & LOTO" },
      { id: "HEIGHT", label: "🦺 Height Safety" },
      { id: "FIRE", label: "🧯 Fire & Emergency" },
      { id: "HEALTH", label: "🩹 First Aid & Health" },
      { id: "RIG", label: "🏗️ Rigging & Tools" },
      { id: "CONF", label: "🕳️ Confined Space" },
      { id: "CHEM", label: "🧪 Chemical Safety" }
    ];
    const filterBarHtml =
      '<div class="cal-filter-bar">' +
        categories.map((c) =>
          '<button type="button" class="cal-filter-pill' + (f === c.id ? ' active' : '') + '" onclick="window.CALENDAR_FILTER=\'' + c.id + '\';renderCalendar()">' + c.label + '</button>'
        ).join('') +
      '</div>';

    let contentHtml = '';
    if (window.CALENDAR_VIEW === "GRID") {
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();

      const startDayIndex = (firstDay.getDay() + 6) % 7;
      const prevMonthLastDay = new Date(year, month, 0).getDate();

      const daysOfWeek = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      const gridHeadHtml = daysOfWeek.map((d) => '<div class="cal-head-cell">' + d + '</div>').join('');

      let cellsHtml = '';

      for (let i = startDayIndex - 1; i >= 0; i--) {
        const dNum = prevMonthLastDay - i;
        cellsHtml +=
          '<div class="cal-day-cell other-month">' +
            '<div class="cal-cell-header">' +
              '<span class="cal-day-num">' + dNum + '</span>' +
            '</div>' +
          '</div>';
      }

      const todayIso = now.toISOString().split("T")[0];
      for (let d = 1; d <= daysInMonth; d++) {
        const dStr = String(d).padStart(2, "0");
        const mStr = String(month + 1).padStart(2, "0");
        const cellDate = year + "-" + mStr + "-" + dStr;
        const isToday = cellDate === todayIso;

        const dayTrainings = filtered.filter((t) => String(t.date || "").startsWith(cellDate));

        let chipsHtml = '';
        if (dayTrainings.length > 0) {
          chipsHtml = '<div class="cal-chips-wrap">' +
            dayTrainings.map((t) => {
              const cat = getTrainingCat(t);
              const isDone = String(t.status || "").toUpperCase() === "COMPLETED";
              return (
                '<div class="cal-chip' + (isDone ? ' completed' : '') + '" style="background:' + cat.bg + ';color:' + cat.color + ';border-color:' + cat.border + '" onclick="event.stopPropagation();openTrainingDetailsModal(\'' + esc(t.id) + '\')" title="' + esc(t.topic) + ' (' + esc(t.dept || 'General') + ')">' +
                  '<span>' + cat.icon + '</span>' +
                  '<span style="overflow:hidden;text-overflow:ellipsis">' + esc(t.topic) + '</span>' +
                '</div>'
              );
            }).join('') +
          '</div>';
        }

        const clickAttr = canManage ? ' onclick="openScheduleTrainingModal(\'' + cellDate + '\')"' : '';

        cellsHtml +=
          '<div class="cal-day-cell' + (isToday ? ' today' : '') + '"' + clickAttr + ' title="' + (canManage ? 'Click to schedule training on ' + cellDate : cellDate) + '">' +
            '<div class="cal-cell-header">' +
              '<span class="cal-day-num">' + d + '</span>' +
              (isToday ? '<span class="cal-today-badge">Today</span>' : (canManage ? '<span class="cal-add-hint">+</span>' : '')) +
            '</div>' +
            chipsHtml +
          '</div>';
      }

      const totalCellsFilled = startDayIndex + daysInMonth;
      const totalCellsNeeded = Math.ceil(totalCellsFilled / 7) * 7;
      const trailingDays = totalCellsNeeded - totalCellsFilled;
      for (let t = 1; t <= trailingDays; t++) {
        cellsHtml +=
          '<div class="cal-day-cell other-month">' +
            '<div class="cal-cell-header">' +
              '<span class="cal-day-num">' + t + '</span>' +
            '</div>' +
          '</div>';
      }

      contentHtml =
        '<div class="cal-grid-card">' +
          '<div class="cal-grid-matrix">' + gridHeadHtml + cellsHtml + '</div>' +
        '</div>';
    } else {
      // Agenda Schedule View
      const sorted = [...filtered].sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")));
      const todayIso = now.toISOString().split("T")[0];

      const todayItems = sorted.filter((t) => String(t.date || "").startsWith(todayIso));
      const upcomingItems = sorted.filter((t) => String(t.date || "").split(" ")[0] > todayIso && String(t.status || "").toUpperCase() !== "COMPLETED");
      const pastItems = sorted.filter((t) => String(t.date || "").split(" ")[0] < todayIso || String(t.status || "").toUpperCase() === "COMPLETED");

      function renderAgendaCard(t, isToday) {
        const cat = getTrainingCat(t);
        const isDone = String(t.status || "").toUpperCase() === "COMPLETED";
        const dateParts = String(t.date || "").split(" ")[0].split("-");
        const dNum = dateParts[2] || "01";
        const mIdx = Number(dateParts[1] || 1) - 1;
        const mName = monthNames[mIdx] ? monthNames[mIdx].substring(0, 3) : "Mon";
        const countdown = getDaysUntil(t.date);
        const proj = (STATE.projects || []).find((p) => p.id === t.projectId);

        return (
          '<div class="cal-agenda-card' + (isToday ? ' today-card' : '') + '">' +
            '<div style="display:flex;align-items:center;gap:14px;min-width:0;flex:1">' +
              '<div class="cal-agenda-date-box" style="border-color:' + (isToday ? '#99f6e4' : '#e2e8f0') + '">' +
                '<div class="cal-agenda-date-day" style="color:' + (isToday ? '#0f766e' : '#0f172a') + '">' + dNum + '</div>' +
                '<div class="cal-agenda-date-mon">' + mName + '</div>' +
              '</div>' +
              '<div class="cal-agenda-info">' +
                '<div class="cal-agenda-topic">' +
                  '<span style="font-size:18px">' + cat.icon + '</span>' +
                  '<span>' + esc(t.topic) + '</span>' +
                  (countdown ? '<span class="cal-pill-badge" style="background:#f1f5f9;color:#475569;border:1px solid #e2e8f0">' + countdown + '</span>' : '') +
                  (isDone ? '<span class="cal-pill-badge" style="background:#ecfdf5;color:#059669;border:1px solid #a7f3d0">✓ Completed</span>' : '') +
                '</div>' +
                '<div class="cal-agenda-meta">' +
                  '<span>🏢 Site: <b>' + esc(proj ? proj.name : (t.projectId === '*' ? 'All Sites' : t.projectId)) + '</b></span>' +
                  '<span>👥 Dept: <b>' + esc(t.dept || 'Site Wide') + '</b></span>' +
                  '<span>👤 Trainer: <b>' + esc(t.owner || 'Safety Team') + '</b></span>' +
                  (t.notes ? '<span style="color:#64748b">📝 ' + esc(t.notes) + '</span>' : '') +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div class="cal-agenda-actions">' +
              '<button type="button" class="ghost small" onclick="openTrainingDetailsModal(\'' + esc(t.id) + '\')">👁️ Details</button>' +
              (canManage && !isDone ? '<button type="button" class="btn small" style="background:#059669;border-color:#059669;color:#fff" onclick="markTrainingCompleted(\'' + esc(t.id) + '\')">✅ Complete</button>' : '') +
              (canManage ? '<button type="button" class="ghost small" style="color:#dc2626;border-color:#fecaca" onclick="confirmDeleteTraining(\'' + esc(t.id) + '\')">🗑️</button>' : '') +
            '</div>' +
          '</div>'
        );
      }

      let agendaHtml = '';
      if (todayItems.length > 0) {
        agendaHtml +=
          '<div class="cal-agenda-section">' +
            '<div class="cal-agenda-sec-title">🚨 Today\'s Training Sessions (' + todayItems.length + ')</div>' +
            todayItems.map((t) => renderAgendaCard(t, true)).join('') +
          '</div>';
      }

      if (upcomingItems.length > 0) {
        agendaHtml +=
          '<div class="cal-agenda-section" style="margin-top:10px">' +
            '<div class="cal-agenda-sec-title">⏳ Upcoming Scheduled Sessions (' + upcomingItems.length + ')</div>' +
            upcomingItems.map((t) => renderAgendaCard(t, false)).join('') +
          '</div>';
      }

      if (pastItems.length > 0) {
        agendaHtml +=
          '<div class="cal-agenda-section" style="margin-top:10px">' +
            '<div class="cal-agenda-sec-title" style="color:#64748b">✅ Completed &amp; Past Records (' + pastItems.length + ')</div>' +
            pastItems.map((t) => renderAgendaCard(t, false)).join('') +
          '</div>';
      }

      if (!sorted.length) {
        agendaHtml =
          '<div class="card" style="text-align:center;padding:48px 16px;background:#ffffff;border-radius:12px;border:1px solid #e2e8f0">' +
            '<div style="font-size:42px;margin-bottom:8px">🎓</div>' +
            '<h3 style="margin:0 0 6px">No training sessions found</h3>' +
            '<p class="muted" style="margin:0 0 16px">No sessions matching the selected filter or search.</p>' +
            (canManage ? '<button type="button" class="btn small" onclick="openScheduleTrainingModal()">+ Schedule a Session</button>' : '') +
          '</div>';
      }

      contentHtml = '<div class="cal-agenda-wrap">' + agendaHtml + '</div>';
    }

    $("view").innerHTML =
      '<div class="cal-wrap">' +
        subTabsHtml +
        statBarHtml +
        projectFilterBarHtml +
        topbarHtml +
        filterBarHtml +
        contentHtml +
      '</div>';
  }
  window.renderCalendar = renderCalendar;

  function navCalendarMonth(delta) {
    let m = (window.CALENDAR_MONTH || 0) + delta;
    let y = window.CALENDAR_YEAR || new Date().getFullYear();
    if (m < 0) { m = 11; y--; }
    else if (m > 11) { m = 0; y++; }
    window.CALENDAR_MONTH = m;
    window.CALENDAR_YEAR = y;
    renderCalendar();
  }
  window.navCalendarMonth = navCalendarMonth;

      toast("Access Denied: Only Safety Managers can schedule training sessions.", "error");
      return;

    const defaultDate = prefillDate || new Date().toISOString().split("T")[0];
    const projects = STATE.projects || [];
    const pId = currentProjectId();

    const projOptions = '<option value="*">All Project Sites (Company Wide)</option>' +
      projects.map((p) => '<option value="' + esc(p.id) + '"' + (pId === p.id ? ' selected' : '') + '>' + esc(p.name) + ' (' + esc(p.code) + ')</option>').join('');

    const presetOptions = '<option value="">-- Choose from Standard Safety Modules --</option>' +
      TRAINING_PRESETS.map((p, idx) => '<option value="' + idx + '">' + p.icon + ' ' + esc(p.title) + '</option>').join('');

    const modalHtml =
      '<div style="max-width:560px;margin:0 auto;text-align:left">' +

        '</div>' +
        '<form id="sch-tr-form" class="form-grid">' +
          '<div class="full">' +
            '<label>Quick Standard Module Preset</label>' +

          '</div>' +
          fieldVal("topic", "Training Topic / Course Title", "text", "") +
          fieldVal("date", "Scheduled Date", "date", defaultDate) +
          fieldVal("owner", "Faculty / Trainer In-Charge", "text", USER.name || "") +

          '<div>' +
            '<label>Target Project Site</label>' +

      ev.preventDefault();

      try {
        const fd = new FormData(this);

      }
    };

  async function markTrainingCompleted(trainingId) {
    const t = (STATE.training || []).find((x) => x.id === trainingId);
    if (!t) return;
    try {
      await run("apiSaveTraining", TOKEN, {
        id: t.id,
        status: "COMPLETED"
      });
      hideModal();
      await refresh();
      go("calendar");
      toast("Training session marked as COMPLETED!", "success");
    } catch (err) {
      toast("Failed to update status: " + (err && err.message ? err.message : err), "error");
    }
  }
  window.markTrainingCompleted = markTrainingCompleted;

  function confirmDeleteTraining(trainingId) {
    const t = (STATE.training || []).find((x) => x.id === trainingId);
    if (!t) return;

    const modalHtml =
      '<div style="max-width:440px;margin:0 auto;text-align:left">' +

  async function executeDeleteTraining(trainingId) {
    const btn = $("del-tr-btn");
    if (btn) { btn.disabled = true; btn.textContent = "Removing..."; }
    try {
      await run("apiDeleteTraining", TOKEN, trainingId);
      hideModal();
      await refresh();
      go("calendar");
      toast("Training session removed from calendar.", "success");

      toast("Failed to delete training: " + (err && err.message ? err.message : err), "error");

  function getDismissedNotifIds() {
    if (!USER || !USER.employeeId) return new Set();
    try {
      const raw = localStorage.getItem("sesipl_dismissed_notifs_" + USER.employeeId);
      if (raw) {
        const arr = JSON.parse(raw);
        if (Array.isArray(arr)) return new Set(arr);
      }
    } catch (e) {}
    return new Set();
  }

  function markNotifDismissedLocal(notifId) {
    if (!USER || !USER.employeeId || !notifId) return;
    try {
      const set = getDismissedNotifIds();
      set.add(notifId);
      localStorage.setItem("sesipl_dismissed_notifs_" + USER.employeeId, JSON.stringify(Array.from(set).slice(-500)));
    } catch (e) {}
  }

  function markAllNotifsDismissedLocal(ids) {
    if (!USER || !USER.employeeId || !ids || !ids.length) return;
    try {
      const set = getDismissedNotifIds();
      ids.forEach(id => set.add(id));
      localStorage.setItem("sesipl_dismissed_notifs_" + USER.employeeId, JSON.stringify(Array.from(set).slice(-500)));
    } catch (e) {}
  }
