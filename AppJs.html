  function attachNotifSwipe(card, notif) {
    let startX = 0;
    let startY = 0;
    let isDragging = false;
    let hasMoved = false;
    let startTime = 0;

    function handleStart(clientX, clientY) {
      startX = clientX;
      startY = clientY;
      isDragging = false;
      hasMoved = false;
      startTime = Date.now();
      card.classList.remove('swiping');
    }

    function handleMove(clientX, clientY, e) {
      const dx = clientX - startX;
      const dy = clientY - startY;

      if (!isDragging && Math.abs(dy) > Math.abs(dx)) return;

      if (dx > 8) {
        if (e && e.cancelable) e.preventDefault();
        isDragging = true;
        hasMoved = true;
        card.classList.add('swiping');
        const clampedDx = Math.max(0, dx);
        const opacity = Math.max(0.15, 1 - (clampedDx / 320));
        card.style.transform = 'translateX(' + clampedDx + 'px)';
        card.style.opacity = opacity;
      }
    }

    function handleEnd(clientX) {
      if (isDragging) {
        card.classList.remove('swiping');
        const dx = clientX - startX;
        const elapsed = Math.max(1, Date.now() - startTime);
        const velocity = dx / elapsed;

        if (dx > 75 || (dx > 30 && velocity > 0.35)) {
          dismissNotif(notif.id, card);
        } else {
          card.style.transform = 'translateX(0px)';
          card.style.opacity = '1';
        }
        isDragging = false;
      } else if (!hasMoved) {
        onNotifTap(notif);
      }
    }

    card.addEventListener('touchstart', (e) => {
      if (e.touches && e.touches.length === 1) {
        handleStart(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    card.addEventListener('touchmove', (e) => {
      if (e.touches && e.touches.length === 1) {
        handleMove(e.touches[0].clientX, e.touches[0].clientY, e);
      }
    }, { passive: false });

    card.addEventListener('touchend', (e) => {
      const touch = e.changedTouches && e.changedTouches[0];
      handleEnd(touch ? touch.clientX : startX);
    });

    card.addEventListener('touchcancel', () => {
      isDragging = false;
      card.classList.remove('swiping');
      card.style.transform = 'translateX(0px)';
      card.style.opacity = '1';
    });

    let isMouseDown = false;
    card.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      isMouseDown = true;
      handleStart(e.clientX, e.clientY);

      function onMouseMove(me) {
        if (!isMouseDown) return;
        handleMove(me.clientX, me.clientY, me);
      }

      function onMouseUp(me) {
        if (!isMouseDown) return;
        isMouseDown = false;
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);
        handleEnd(me.clientX);
      }

      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
    });
  }

  function dismissNotif(notifId, card) {
    // 1. Persist dismissed ID locally so it never appears again
    markNotifDismissedLocal(notifId);

    // 2. Remove from active state immediately
    if (STATE && STATE.notifications) {
      STATE.notifications = STATE.notifications.filter(x => x.id !== notifId);
    }
    updateNotifBadge();

    // 3. Smooth animated dismissal
    const wrap = $('notif-wrap-' + notifId) || (card ? card.parentElement : null);
    if (card) {
      card.style.transition = 'transform 0.28s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.28s ease';
      card.style.transform = 'translateX(120%)';
      card.style.opacity = '0';
    }
    setTimeout(() => {
      if (wrap) {
        wrap.classList.add('dismissing');
        setTimeout(() => {
          try { wrap.remove(); } catch (e) {}
          checkNotifsEmpty();
        }, 300);
      }
    }, 80);

    // 4. Record dismissal in Google Sheets
    run('apiDismissNotification', TOKEN, notifId).catch(e => console.warn('apiDismissNotification sync: ', e));
  }
  window.dismissNotif = dismissNotif;

  async function clearAllNotifications() {
    const list = $('notif-list-container');
    if (!list) return;

    const active = getActiveNotifications();
    const ids = active.map(n => n.id);

    // 1. Persist all IDs in localStorage immediately
    markAllNotifsDismissedLocal(ids);

    // 2. Remove all from active state immediately
    if (STATE && STATE.notifications) {
      STATE.notifications = STATE.notifications.filter(n => !ids.includes(n.id));
    }
    updateNotifBadge();

    // 3. Staggered card swipe-out animation
    const cards = list.querySelectorAll('.notif-card');
    cards.forEach((c, idx) => {
      setTimeout(() => {
        c.style.transition = 'transform 0.25s ease, opacity 0.25s ease';
        c.style.transform = 'translateX(120%)';
        c.style.opacity = '0';
        const wrap = c.parentElement;
        if (wrap) wrap.classList.add('dismissing');
      }, idx * 25);
    });

    // 4. Render clean empty state
    setTimeout(() => {
      list.innerHTML = '<div class="notif-empty-state"><div class="notif-empty-icon">✓</div><h4>All caught up!</h4><p class="muted">No active notifications</p></div>';
      const clearBtn = $('notif-clear-all-btn');
      if (clearBtn) clearBtn.style.display = 'none';
      const countBadge = $('notif-unread-count');
      if (countBadge) countBadge.textContent = '0';
    }, Math.min(cards.length * 25 + 150, 600));

    // 5. Tell server in background
    try {
      await run('apiClearAllNotifications', TOKEN);
    } catch (e) {
      console.warn('apiClearAllNotifications sync: ', e);
    }
  }
  window.clearAllNotifications = clearAllNotifications;

  function onNotifTap(notif) {
    if (!notif) return;

    // 1. Permanently dismiss locally so it will never show again
    markNotifDismissedLocal(notif.id);

    // 2. Remove from active state immediately
    if (STATE && STATE.notifications) {
      STATE.notifications = STATE.notifications.filter((x) => x.id !== notif.id);
    }
    updateNotifBadge();

    // 3. Sync dismissal to Sheets in background
    run('apiDismissNotification', TOKEN, notif.id).catch((e) => console.warn('apiDismissNotification sync: ', e));

    if (notif.projectId && notif.projectId !== '*') {
      const pSel = $('project-select');
      if (pSel && Array.from(pSel.options).some((o) => o.value === notif.projectId)) {
        pSel.value = notif.projectId;
      }
    }

    const type = String(notif.type || '').toUpperCase();
    const title = String(notif.title || '').toLowerCase();
    let targetView = 'dashboard';

    if (type === 'APPROVAL' || title.indexOf('approval') >= 0 || title.indexOf('submitted') >= 0 || title.indexOf('pending') >= 0) {
      targetView = 'inbox';
    } else if (type === 'OBSERVATION' || type === 'ESCALATION' || title.indexOf('observation') >= 0 || title.indexOf('escalat') >= 0) {
      targetView = 'observations';
    } else if (type === 'GALLERY' || title.indexOf('gallery') >= 0) {
      targetView = 'gallery';
    } else if (type === 'TRAINING' || title.indexOf('training') >= 0) {
      targetView = 'calendar';
    } else if (type === 'PERMIT' || title.indexOf('permit') >= 0) {
      targetView = 'permits';
    } else if (type === 'DAILY' || title.indexOf('daily log') >= 0 || title.indexOf('dailylog') >= 0) {
      targetView = 'dailylog';
    } else if (type === 'PPE' || title.indexOf('ppe') >= 0) {
      targetView = 'trackers';
    } else if (type === 'AUDIT' || title.indexOf('audit') >= 0) {
      targetView = 'trackers';
    } else if (type === 'DOCUMENT' || title.indexOf('document') >= 0) {
      targetView = 'documents';
    }

    hideModal();
    go(targetView);
  }
  window.onNotifTap = onNotifTap;

  function checkNotifsEmpty() {
    const list = $('notif-list-container');
    if (!list) return;
    const remaining = list.querySelectorAll('.notif-wrapper:not(.dismissing)');
    if (remaining.length === 0) {
      list.innerHTML = '<div class="notif-empty-state"><div class="notif-empty-icon">✓</div><h4>All caught up!</h4><p class="muted">No active notifications</p></div>';
      const clearBtn = $('notif-clear-all-btn');
      if (clearBtn) clearBtn.style.display = 'none';
      const countBadge = $('notif-unread-count');
      if (countBadge) countBadge.textContent = '0';
    }
  }

  /* =========================================================
     ENTERPRISE REAL-WORLD COMMENT SYSTEM
     ========================================================= */
  function timeAgo(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return String(iso);
      const diffSec = Math.floor((Date.now() - d.getTime()) / 1000);
      if (diffSec < 45) return "Just now";
      if (diffSec < 3600) return Math.floor(diffSec / 60) + "m ago";
      if (diffSec < 86400) return Math.floor(diffSec / 3600) + "h ago";
      if (diffSec < 172800) return "Yesterday at " + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      return d.toLocaleDateString([], { day: '2-digit', month: 'short' }) + " " + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    } catch (e) {
      return String(iso);
    }
  }

  function getRoleTheme(role) {
    const r = String(role || "").toUpperCase();
    if (r === "DIRECTOR") {
      return { bg: "#eef2ff", color: "#4338ca", border: "#c7d2fe", label: "DIRECTOR" };
    }
    if (r === "EHS_MANAGER") {
      return { bg: "#f0fdfa", color: "#0f766e", border: "#99f6e4", label: "EHS MANAGER" };
    }
    if (r === "ASST_EHS_MANAGER") {
      return { bg: "#f0f9ff", color: "#0369a1", border: "#bae6fd", label: "ASST MANAGER" };
    }
    if (r === "EHS_LEAD") {
      return { bg: "#fffbeb", color: "#b45309", border: "#fde68a", label: "EHS LEAD" };
    }
    return { bg: "#f1f5f9", color: "#475569", border: "#cbd5e1", label: role || "TEAM" };
  }

  function getInitials(name) {
    const parts = String(name || "").trim().split(/\s+/);
    if (!parts.length || !parts[0]) return "??";
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  function formatCommentText(raw) {
    let s = esc(raw);
    s = s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
    s = s.replace(/(@[A-Za-z0-9_]+)/g, '<span class="comment-mention">$1</span>');
    return s;
  }

  function renderCommentCard(c, entityType, entityId) {
    const isSelf = c.byEmployeeId === USER.employeeId;
    const theme = getRoleTheme(c.role);
    const initials = getInitials(c.byName);
    const timeStr = timeAgo(c.createdAt);
    const canDelete = isSelf || USER.role === "DIRECTOR" || USER.role === "EHS_MANAGER";

    return (
      '<div class="comment-item ' + (isSelf ? 'self' : '') + '" id="comment-card-' + esc(c.id) + '">' +
        '<div class="comment-avatar" style="background:' + theme.bg + ';color:' + theme.color + ';border-color:' + theme.border + '">' +
          esc(initials) +
        '</div>' +
        '<div class="comment-bubble">' +
          '<div class="comment-author-bar">' +
            '<div class="comment-author-left">' +
              '<span>' + esc(c.byName || c.byEmployeeId) + '</span>' +
              '<span class="comment-role-tag" style="background:' + theme.bg + ';color:' + theme.color + '">' + esc(theme.label) + '</span>' +
              (isSelf ? '<span class="comment-you-tag">(You)</span>' : '') +
            '</div>' +
            '<div class="comment-author-right">' +
              (String(c.broadcast) === 'TRUE' ? '<span class="comment-broadcast-tag">📢 Notice</span>' : '') +
              '<span class="comment-time" title="' + esc(c.createdAt || '') + '">' + esc(timeStr) + '</span>' +
              (canDelete ? '<button type="button" class="comment-del-btn" title="Delete comment" onclick="deleteComment(\'' + esc(c.id) + '\',\'' + esc(entityType) + '\',\'' + esc(entityId) + '\')">🗑️</button>' : '') +
            '</div>' +
          '</div>' +
          '<div class="comment-text">' + formatCommentText(c.text) + '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function openComments(entityType, entityId, title, meta) {
    meta = meta || {};
    const projectId = meta.projectId || currentProjectId() || (STATE.projects && STATE.projects[0] ? STATE.projects[0].id : "");
    const comments = (STATE.comments || []).filter(
      (c) => c.entityId === entityId || (c.entityType === entityType && c.entityId === entityId)
    );

    const canBroadcast = USER.role === "DIRECTOR" || USER.role === "EHS_MANAGER";
    const projObj = (STATE.projects || []).find(p => p.id === projectId);
    const projName = projObj ? (projObj.name || projObj.code) : projectId;
    const statusTag = meta.status ? statusPill(meta.status) : '';

    let timelineHtml = '';
    if (!comments.length) {
      timelineHtml =
        '<div class="comments-empty" id="comments-empty-placeholder">' +
          '<div class="comments-empty-icon">💬</div>' +
          '<div class="comments-empty-title">No comments yet</div>' +
          '<p class="muted">Start the safety discussion or add review notes for the team.</p>' +
        '</div>';
    } else {
      timelineHtml = comments.map(c => renderCommentCard(c, entityType, entityId)).join('');
    }

    const cannedChips = [
      '⚠️ Action required on site',
      '📸 Please attach rectified photo',
      '✅ Verified compliant per standard',
      '⚡ Work stopped until safety fix',
      '📋 Checklist verified by PMC team'
    ];

    const cannedHtml = cannedChips.map(chip =>
      '<button type="button" class="comment-canned-chip" data-canned="' + esc(chip) + '" onclick="insertCannedComment(this.getAttribute(\'data-canned\'))">' + esc(chip) + '</button>'
    ).join('');

    const html =
      '<div class="comments-modal">' +
        '<div class="comments-head">' +
          '<div class="comments-title-wrap">' +
            '<div class="comments-title-row">' +
              '<h3>' + esc(title || 'Discussion') + '</h3>' +
              '<span class="comments-count-pill" id="comment-thread-count">' + comments.length + '</span>' +
              statusTag +
            '</div>' +
            '<div class="comments-meta-sub">' +
              (projName ? '<span>🏢 ' + esc(projName) + '</span>' : '') +
              '<span>&bull; Real-time Safety Discussion</span>' +
            '</div>' +
          '</div>' +
          '<button type="button" class="modal-close" onclick="hideModal()" aria-label="Close">×</button>' +
        '</div>' +

        '<div class="comments-timeline" id="comments-timeline-container">' +
          timelineHtml +
        '</div>' +

        '<div class="comment-canned-bar">' +
          cannedHtml +
        '</div>' +

        '<div class="comments-composer">' +
          '<textarea id="new-comment-textarea" class="comments-textarea" placeholder="Type your comment, instructions, or site feedback... (Ctrl+Enter to post)" onkeydown="handleCommentKeydown(event, \'' + esc(entityType) + '\',\'' + esc(entityId) + '\',\'' + esc(projectId) + '\')"></textarea>' +
          '<div class="comments-foot">' +
            (canBroadcast ? '<label class="comments-broadcast-label"><input type="checkbox" id="comment-broadcast-check"> <span>Broadcast notice to project team</span></label>' : '<span></span>') +
            '<div class="comments-foot-right">' +
              '<span class="comments-kbd-hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd></span>' +
              '<button type="button" class="comments-post-btn" id="post-comment-btn" onclick="submitComment(\'' + esc(entityType) + '\',\'' + esc(entityId) + '\',\'' + esc(projectId) + '\')">' +
                '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>' +
                '<span>Post Comment</span>' +
              '</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    showModal(html);

    setTimeout(() => {
      const container = $('comments-timeline-container');
      if (container) container.scrollTop = container.scrollHeight;
      const ta = $('new-comment-textarea');
      if (ta) ta.focus();
    }, 100);
  }
  window.openComments = openComments;

  window.insertCannedComment = function(text) {
    if (!text) return;
    const ta = $('new-comment-textarea');
    if (!ta) return;
    if (ta.value.trim()) {
      ta.value = ta.value.trim() + "\n" + text;
    } else {
      ta.value = text;
    }
    ta.focus();
    try {
      ta.dispatchEvent(new Event('input', { bubbles: true }));
    } catch (_) {}
  };

  window.handleCommentKeydown = function(e, entityType, entityId, projectId) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      submitComment(entityType, entityId, projectId);
    }
  };

  window.submitComment = async function(entityType, entityId, projectId) {
    const ta = $('new-comment-textarea');
    if (!ta) return;
    const text = ta.value.trim();
    if (!text) {
      ta.focus();
      return;
    }

    const bCheck = $('comment-broadcast-check');
    const isBroadcast = bCheck && bCheck.checked;

    const btn = $('post-comment-btn');
    if (btn) btn.disabled = true;
    ta.value = '';

    const tempId = 'tmp_' + Date.now();
    const optComment = {
      id: tempId,
      entityType: entityType,
      entityId: entityId,
      projectId: projectId,
      byEmployeeId: USER.employeeId,
      byName: USER.name,
      role: USER.role,
      text: text,
      createdAt: new Date().toISOString(),
      broadcast: isBroadcast ? 'TRUE' : 'FALSE'
    };

    if (!STATE.comments) STATE.comments = [];
    STATE.comments.push(optComment);

    const timeline = $('comments-timeline-container');
    const emptyPlaceholder = $('comments-empty-placeholder');
    if (emptyPlaceholder) emptyPlaceholder.remove();

    if (timeline) {
      const cardHtml = renderCommentCard(optComment, entityType, entityId);
      const div = document.createElement('div');
      div.innerHTML = cardHtml;
      if (div.firstElementChild) {
        timeline.appendChild(div.firstElementChild);
        timeline.scrollTop = timeline.scrollHeight;
      }
    }

    const countBadge = $('comment-thread-count');
    if (countBadge) {
      countBadge.textContent = parseInt(countBadge.textContent || '0', 10) + 1;
    }

    try {
      const res = await run("apiAddComment", TOKEN, {
        entityType: entityType,
        entityId: entityId,
        projectId: projectId,
        text: text,
        broadcast: isBroadcast
      });
      if (res && res.comment && res.comment.id) {
        optComment.id = res.comment.id;
        const domCard = $('comment-card-' + tempId);
        if (domCard) domCard.id = 'comment-card-' + res.comment.id;
      }
    } catch (err) {
      alert("Failed to save comment: " + (err && err.message ? err.message : err));
    } finally {
      if (btn) btn.disabled = false;
    }
  };

  window.deleteComment = async function(commentId, entityType, entityId) {
    if (!confirm("Delete this comment?")) return;
    const domCard = $('comment-card-' + commentId);
    if (domCard) {
      domCard.style.opacity = '0.3';
      domCard.style.pointerEvents = 'none';
    }
    try {
      await run("apiDeleteComment", TOKEN, commentId);
      if (domCard) domCard.remove();
      STATE.comments = (STATE.comments || []).filter(c => c.id !== commentId);
      const countBadge = $('comment-thread-count');
      if (countBadge) {
        const c = Math.max(0, parseInt(countBadge.textContent || '1', 10) - 1);
        countBadge.textContent = c;
      }
      const timeline = $('comments-timeline-container');
      if (timeline && !timeline.children.length) {
        timeline.innerHTML =
          '<div class="comments-empty" id="comments-empty-placeholder">' +
            '<div class="comments-empty-icon">💬</div>' +
            '<div class="comments-empty-title">No comments yet</div>' +
            '<p class="muted">Start the safety discussion or add review notes for the team.</p>' +
          '</div>';
      }
    } catch (e) {
      alert("Failed to delete comment: " + (e && e.message ? e.message : e));
      if (domCard) {
        domCard.style.opacity = '1';
        domCard.style.pointerEvents = 'auto';
      }
    }
  };

  /* =========================================================
     DEDICATED REVIEW & SIGNOFF MODAL
     ========================================================= */
  function openReviewModal(id, formTitle, projectName, submitter, defaultAction) {
    let currentAction = defaultAction || "APPROVE";

    function getModalHtml(act, commentText) {
      const isApprove = act === "APPROVE";
      const rejectionPresets = [
        "⚠️ Missing required safety hazard identification / risk assessment",
        "✍️ Missing authorized signatures / permit issuer approval",
        "📸 Site verification photograph not attached or unclear",
        "⏳ Expired equipment calibration / operator license",
        "📋 Incomplete safety checklist observations or rectifications"
      ];
      const presetHtml = rejectionPresets.map(p =>
        '<button type="button" class="review-reason-pill" data-preset="' + esc(p) + '" onclick="selectReviewPreset(this.getAttribute(\'data-preset\'))">' + esc(p) + '</button>'
      ).join('');

      return (
        '<div class="review-modal">' +
          '<div class="review-modal-head">' +
            '<h3>Review &amp; Sign Off Submission</h3>' +
            '<span class="muted" style="font-size:12px">SESIPL EHS Compliance Chain</span>' +
          '</div>' +
          '<div class="review-info-box">' +
            '<div><b>Form:</b> ' + esc(formTitle) + '</div>' +
            '<div><b>Project:</b> ' + esc(projectName) + '</div>' +
            '<div><b>Submitted By:</b> ' + esc(submitter) + '</div>' +
            '<div><b>Reviewer:</b> ' + esc(USER.name) + ' (' + esc(USER.role) + ')</div>' +
          '</div>' +
          '<div class="review-action-selector">' +
            '<button type="button" class="review-action-btn approve ' + (isApprove ? 'active' : '') + '" onclick="setReviewAction(\'APPROVE\')">' +
              '<strong>✓ Approve &amp; Sign</strong>' +
              '<span>Lock records &amp; update stats</span>' +
            '</button>' +
            '<button type="button" class="review-action-btn reject ' + (!isApprove ? 'active' : '') + '" onclick="setReviewAction(\'REJECT\')">' +
              '<strong>↩ Return for Revision</strong>' +
              '<span>Send back to Lead with notes</span>' +
            '</button>' +
          '</div>' +
          (!isApprove ?
            '<div class="review-reasons-wrap">' +
              '<div class="review-reasons-title">Quick Rejection Reason Presets:</div>' +
              '<div class="review-reasons-grid">' + presetHtml + '</div>' +
            '</div>' : '') +
          '<div class="review-comment-box">' +
            '<label for="review-comment-input">' + (isApprove ? 'Optional Review Remarks / Compliance Notes:' : 'Return Remarks to Lead (Required):') + '</label>' +
            '<textarea id="review-comment-input" class="comments-textarea" placeholder="' + (isApprove ? 'Enter any commendations or approval notes...' : 'Explain the defects or missing items that must be corrected before approval...') + '">' + esc(commentText || '') + '</textarea>' +
          '</div>' +
          '<div class="review-actions-bar">' +
            '<button type="button" class="ghost" onclick="hideModal()">Cancel</button>' +
            '<button type="button" id="review-submit-btn" class="btn small ' + (isApprove ? '' : 'danger') + '" onclick="submitReviewSignoff(\'' + esc(id) + '\')">' +
              (isApprove ? 'Confirm Approval' : 'Confirm Return') +
            '</button>' +
          '</div>' +
        '</div>'
      );
    }

    window.setReviewAction = function(act) {
      currentAction = act;
      const ta = $('review-comment-input');
      const text = ta ? ta.value : '';
      showModal(getModalHtml(currentAction, text));
    };

    window.selectReviewPreset = function(preset) {
      if (!preset) return;
      const ta = $('review-comment-input');
      if (ta) {
        if (ta.value.trim()) {
          ta.value = ta.value.trim() + "\n" + preset;
        } else {
          ta.value = preset;
        }
        ta.focus();
        try {
          ta.dispatchEvent(new Event('input', { bubbles: true }));
        } catch (_) {}
      }
    };

    window.submitReviewSignoff = async function(subId) {
      const ta = $('review-comment-input');
      const comment = ta ? ta.value.trim() : '';
      if (currentAction === "REJECT" && !comment) {
        alert("A review comment is required when returning a submission.");
        if (ta) ta.focus();
        return;
      }
      const btn = $('review-submit-btn');
      if (btn) {
        btn.disabled = true;
        btn.textContent = "Submitting...";
      }
      try {
        await run("apiReview", TOKEN, subId, currentAction, comment);
        hideModal();
        await refresh();
      } catch (e) {
        alert((e && e.message) ? e.message : e);
        if (btn) {
          btn.disabled = false;
          btn.textContent = currentAction === "APPROVE" ? "Confirm Approval" : "Confirm Return";
        }
      }
    };

    showModal(getModalHtml(currentAction, ""));
  }
  window.openReviewModal = openReviewModal;

  async function exportNow(fmt) {
    const pid =
      currentProjectId() || (STATE.projects[0] && STATE.projects[0].id);
    if (!pid) {
      alert("No project");
      return;
    }
    try {
      const res = await run("apiExportProject", TOKEN, pid, fmt);
      window.open(res.url, "_blank");
    } catch (e) {
      alert(e.message || e);
    }
  }

  async function openFile(fileId) {
    if (!fileId) return;
    if (String(fileId).startsWith("http://") || String(fileId).startsWith("https://")) {
      window.open(fileId, "_blank");
      return;
    }
    if (String(fileId).startsWith("PTW_TEMPLATE_")) {
      const code = fileId.replace("PTW_TEMPLATE_", "");
      await printBlankPtwTemplate(code);
      return;
    }
    const res = await run("apiFileUrl", TOKEN, fileId);
    if (res && res.url) {
      window.open(res.url, "_blank");
    }
  }

  async function refresh() {
    try {
      const bootRes = await run("apiBootstrap", TOKEN);
      if (!bootRes || !bootRes.ok || !bootRes.data) {
        await doLogout();
        return;
      }
      STATE = bootRes.data;
      USER = bootRes.user;
      if (STATE && STATE.notifications) {
        const dismissed = getDismissedNotifIds();
        STATE.notifications = STATE.notifications.filter(n => !dismissed.has(n.id) && String(n.dismissed || '').toUpperCase() !== 'TRUE');
      }
      fillProjects();
      buildNav();
      render();
    } catch (e) {
      await doLogout();
    }
  }

  function showModal(html) {
    $("modal-card").innerHTML = html.indexOf("modal-close") >= 0 ? html : '<button class="modal-close" type="button" aria-label="Close" onclick="hideModal()">×</button>' + html;
    $("modal").hidden = false;
  }
  function hideModal() {
    $("modal").hidden = true;
  }
  function closeModal() {
    hideModal();
  }
  window.showModal = showModal;
  window.hideModal = hideModal;
  window.closeModal = closeModal;
  function esc(s) {
    return String(s == null ? "" : s).replace(
      /[&<>"']/g,
      (c) =>
        ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[c],
    );
  }
  function blobToB64(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }

  if (TOKEN) {
    boot().catch(() => {
      sessionStorage.removeItem(TOKEN_KEY);
      TOKEN = "";
      initLoginCard();
    });
  } else {
    initLoginCard();
  }
</script>
