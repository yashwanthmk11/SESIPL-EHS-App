<script>
  const TOKEN_KEY = "sesipl_ehs_token";
  let TOKEN = sessionStorage.getItem(TOKEN_KEY) || "";
  let USER = null;
  let STATE = null;
  let VIEW = "dashboard";
  let MODULE = null;
  let CHARTS = [];
  let MUTATION_IN_FLIGHT = false;
  const MUTATING_CALLS = new Set([
    "apiSubmitForm", "apiReview", "apiAddComment", "apiDeleteSubmission",
    "apiDeleteUploadedFile",
    "apiSaveDailyLog", "apiSavePpe", "apiSaveScaffold", "apiSaveMovement",
    "apiSaveObservation", "apiCloseObservation", "apiSaveTraining", "apiUploadMeta",
    "apiSaveUser"
  ]);

  const ROLE_LABEL = {
    EHS_LEAD: "EHS Lead",
    ASST_EHS_MANAGER: "Asst EHS Manager",
    EHS_MANAGER: "EHS Manager",
    DIRECTOR: "Director",
  };

  function run(fn, ...args) {
    const isMutation = MUTATING_CALLS.has(fn);
    if (isMutation && MUTATION_IN_FLIGHT) {
      return Promise.reject(new Error("Please wait for the current action to finish."));
    }
    if (isMutation) {
      MUTATION_IN_FLIGHT = true;
      setLoading(true, "Saving securely...");
    }
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler((value) => {
          if (isMutation) finishMutation();
          resolve(value);
        })
        .withFailureHandler((error) => {
          if (isMutation) finishMutation();
          reject(error);
        })
        [fn](...args);
    });
  }

  function finishMutation() {
    MUTATION_IN_FLIGHT = false;
    setLoading(false);
  }

  function setLoading(active, label) {
    const state = $("loading-state");
    if (!state) return;
    if (label) $("loading-label").textContent = label;
    state.hidden = !active;
    document.querySelectorAll("button").forEach((button) => {
      if (active) {
        button.dataset.wasDisabled = button.disabled ? "true" : "false";
        button.disabled = true;
      } else if (button.dataset.wasDisabled) {
        button.disabled = button.dataset.wasDisabled === "true";
        delete button.dataset.wasDisabled;
      }
    });
  }

  function $(id) { return document.getElementById(id); }

  function displayDate(value) {
    const text = String(value == null ? "" : value).trim();
    const match = text.match(/^(\d{4})-(\d{2})-(\d{2})(.*)$/);
    return match ? match[3] + "/" + match[2] + "/" + match[1] + match[4] : text;
  }

  function toggleUanVisibility() {
    const input = $("uan");
    const icon = $("uan-eye-icon");
    const btn = $("uan-toggle-btn");
    if (!input || !icon) return;
    const isPassword = input.type === "password";
    input.type = isPassword ? "text" : "password";
    const label = isPassword ? "Hide UAN" : "Show UAN";
    btn.setAttribute("aria-label", label);
    btn.title = label;
    if (isPassword) {
      icon.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
    } else {
      icon.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    }
    input.focus();
  }

  function openLoginHelp() {
    showModal(`
      <div class="login-help-dialog">
        <h3>Sign In Assistance</h3>
        <p class="muted" style="margin-bottom:16px;">Follow these guidelines to access your SESIPL EHS portal account:</p>
        <div class="login-help-step">
          <div class="login-help-badge">1</div>
          <div class="login-help-desc">
            <strong>Employee ID:</strong> Your assigned company ID code (e.g. <code>EMP001</code>, <code>EMP002</code>).
          </div>
        </div>
        <div class="login-help-step">
          <div class="login-help-badge">2</div>
          <div class="login-help-desc">
            <strong>UAN (PIN / Password):</strong> Your registered Universal Account Number credential as recorded in the master system.
          </div>
        </div>
        <div class="login-help-step">
          <div class="login-help-badge">3</div>
          <div class="login-help-desc">
            <strong>Need Account Activation?</strong> If you cannot sign in or your account is inactive, please contact your site EHS Manager or Administrator.
          </div>
        </div>
        <div style="margin-top:20px; text-align:right;">
          <button class="btn secondary small" onclick="hideModal()">Got it</button>
        </div>
      </div>
    `);
  }

  function initLoginCard() {
    const empInput = $("empId");
    const uanInput = $("uan");
    const rememberCheck = $("remember-emp-id");
    const savedEmp = localStorage.getItem("sesipl_remember_emp_id");

    if (savedEmp && empInput) {
      empInput.value = savedEmp;
      if (rememberCheck) rememberCheck.checked = true;
      if (uanInput && !$("login-screen").hidden) {
        setTimeout(() => uanInput.focus(), 150);
      }
    } else if (empInput && !$("login-screen").hidden) {
      setTimeout(() => empInput.focus(), 150);
    }

    if (empInput && !empInput.dataset.bound) {
      empInput.dataset.bound = "true";
      empInput.addEventListener("input", () => {
        empInput.value = empInput.value.toUpperCase();
      });
    }

    if (uanInput && !uanInput.dataset.bound) {
      uanInput.dataset.bound = "true";
      const checkCaps = (e) => {
        const warning = $("caps-warning");
        if (!warning) return;
        if (e.getModifierState && e.getModifierState("CapsLock")) {
          warning.hidden = false;
        } else {
          warning.hidden = true;
        }
      };
      uanInput.addEventListener("keyup", checkCaps);
      uanInput.addEventListener("keydown", checkCaps);
      uanInput.addEventListener("blur", () => {
        const warning = $("caps-warning");
        if (warning) warning.hidden = true;
      });
    }
  }

  async function doLogin(e) {
    if (e) e.preventDefault();
    const empIdEl = $("empId");
    const uanEl = $("uan");
    const errEl = $("login-err");
    const errTextEl = $("login-err-text");
    const btn = $("login-btn");
    const spinner = $("login-btn-spinner");
    const btnText = $("login-btn-text");
    const card = $("main-login-card") || document.querySelector(".login-card");

    if (errEl) errEl.hidden = true;

    const empId = (empIdEl ? empIdEl.value : "").trim();
    const uan = (uanEl ? uanEl.value : "").trim();

    if (!empId || !uan) {
      if (card) {
        card.classList.remove("shake");
        void card.offsetWidth;
        card.classList.add("shake");
      }
      if (errTextEl) errTextEl.textContent = "Please enter both Employee ID and UAN.";
      if (errEl) errEl.hidden = false;
      if (!empId && empIdEl) empIdEl.focus();
      else if (uanEl) uanEl.focus();
      return false;
    }

    btn.disabled = true;
    if (spinner) spinner.hidden = false;
    if (btnText) btnText.textContent = "Authenticating...";

    try {
      const res = await run("login", empId, uan);
      if (!res.ok) throw new Error(res.error || "Authentication failed.");

      const rememberCheck = $("remember-emp-id");
      if (rememberCheck && rememberCheck.checked) {
        localStorage.setItem("sesipl_remember_emp_id", empId);
      } else {
        localStorage.removeItem("sesipl_remember_emp_id");
      }

      TOKEN = res.token;
      sessionStorage.setItem(TOKEN_KEY, TOKEN);
      USER = res.user;
      if (btnText) btnText.textContent = "Entering Portal...";
      await boot();
    } catch (err) {
      if (card) {
        card.classList.remove("shake");
        void card.offsetWidth;
        card.classList.add("shake");
      }
      if (errTextEl) errTextEl.textContent = err.message || String(err);
      if (errEl) errEl.hidden = false;
      if (uanEl) {
        uanEl.focus();
        uanEl.select();
      }
    } finally {
      btn.disabled = false;
      if (spinner) spinner.hidden = true;
      if (btnText) btnText.textContent = "Sign In to Portal";
    }
    return false;
  }

  async function doLogout() {
    try {
      await run("logout", TOKEN);
    } catch (e) {}
    TOKEN = "";
    USER = null;
    STATE = null;
    sessionStorage.removeItem(TOKEN_KEY);
    $("app-screen").hidden = true;
    $("login-screen").hidden = false;
    if ($("uan")) $("uan").value = "";
    initLoginCard();
  }

  async function boot() {
    const bootRes = await run("apiBootstrap", TOKEN);
    STATE = bootRes.data;
    USER = bootRes.user || USER;
    $("login-screen").hidden = true;
    $("app-screen").hidden = false;
    $("who-name").textContent = USER.name;
    $("side-role").textContent = ROLE_LABEL[USER.role] || USER.role;
    fillProjects();
    buildNav();
    render();
  }

  function fillProjects() {
    const sel = $("project-select");
    sel.innerHTML = "";
    STATE.projects.forEach((p) => {
      const o = document.createElement("option");
      o.value = p.id;
      o.textContent = p.code + " — " + p.name;
      sel.appendChild(o);
    });
    if (USER.role === "EHS_LEAD") {
      sel.disabled = true;
      if (STATE.selectedProjectId) sel.value = STATE.selectedProjectId;
    } else {
      sel.disabled = false;
      if (USER.role === "EHS_MANAGER" || USER.role === "DIRECTOR") {
        const all = document.createElement("option");
        all.value = "";
        all.textContent = "All running projects";
        sel.insertBefore(all, sel.firstChild);
        sel.value = "";
      }
    }
    sel.onchange = () => render();
  }

  function currentProjectId() {
    return $("project-select").value;
  }

  function currentProject() {
    const id = currentProjectId();
    return STATE.projects.find((p) => p.id === id) || null;
  }

  function scopedSubs() {
    const id = currentProjectId();
    return STATE.submissions.filter((s) => !id || s.projectId === id);
  }

  function buildNav() {
    const items = USER.role === "EHS_LEAD"
      ? [
          ["dashboard", "Dashboard"], ["daily", "Daily uploads"],
          ["weekly", "Weekly / Monthly"], ["permits", "Work permits"],
          ["onetime", "One-time docs"], ["observations", "Observations"],
          ["documents", "PDF library"], ["dailylog", "Daily log"],
          ["trackers", "PPE / Scaffold"], ["gallery", "Gallery"],
          ["library", "eLibrary"], ["calendar", "Training calendar"],
        ]
      : [
          ["dashboard", "Dashboard"], ["inbox", "Approvals"],
          ["daily", "Daily uploads"], ["weekly", "Weekly / Monthly"],
          ["permits", "Work permits"], ["onetime", "One-time docs"],
          ["observations", "Observations"], ["documents", "PDF library"],
          ["dailylog", "Daily log"], ["trackers", "PPE / Scaffold"],
          ["gallery", "Gallery"], ["library", "eLibrary"],
          ["calendar", "Training calendar"],
        ];
    if (USER.role === "EHS_MANAGER" || USER.role === "DIRECTOR")
      items.push(["users", "Users"]);
    $("nav").innerHTML = items
      .map(
        ([id, label]) =>
          '<button data-view="' +
          id +
          '" onclick="go(\'' +
          id +
          "')\">" +
          label +
          "</button>",
      )
      .join("");
  }

  function go(view) {
    VIEW = view;
    render();
  }

  function destroyCharts() {
    CHARTS.forEach((c) => {
      try {
        c.destroy();
      } catch (e) {}
    });
    CHARTS = [];
  }

  function render() {
    destroyCharts();
    document
      .querySelectorAll("#nav button")
      .forEach((b) =>
        b.classList.toggle("active", b.getAttribute("data-view") === VIEW),
      );
    const unread = (STATE.notifications || []).filter(
      (n) => String(n.read) !== "TRUE",
    ).length;
    $("badge-n").textContent = unread;
    const map = {
      dashboard: renderDashboard,
      inbox: renderInbox,
      daily: () =>
        renderModuleForms(["CHECKLIST"], "Daily / weekly checklists"),
      weekly: () => renderModuleForms(["WEEKLY"], "Weekly & monthly reports"),
      permits: () => renderModuleForms(["PERMIT"], "Work permits"),
      onetime: () =>
        renderModuleForms(
          ["TEST_CERT", "EHS_DOCS", "LEGAL", "POLICY", "SWMS"],
          "One-time project documents (Assistant Manager uploads; Lead view only)",
        ),
      observations: renderObservations,
      documents: renderDocuments,
      dailylog: renderDailyLog,
      trackers: renderTrackers,
      gallery: renderGallery,
      library: renderLibrary,
      calendar: renderCalendar,
      users: renderUsers,
    };
    (map[VIEW] || renderDashboard)();
  }

  function renderDashboard() {
    const pid = currentProjectId();
    const proj = currentProject();
    const role = USER.role;
    $("page-title").textContent =
      role === "DIRECTOR"
        ? "Director overview"
        : role === "EHS_MANAGER"
          ? "All projects monitor"
          : role === "ASST_EHS_MANAGER"
            ? proj
              ? proj.name + " overview"
              : "Select a project"
            : proj
              ? proj.name
              : "My site";
    $("page-sub").textContent =
      "Employee " + USER.employeeId + " · " + (ROLE_LABEL[role] || role);

    const stats = STATE.stats;
    const bp = stats.byProject || {};
    const use =
      pid && bp[pid]
        ? bp[pid]
        : {
            pending: stats.pendingApprovals,
            approved: stats.approved,
            rejected: stats.rejected,
            openObs: stats.openObservations,
            manHours: stats.manHours,
            compliance: avg(Object.keys(bp).map((k) => bp[k].compliance)),
          };

    if (role === "EHS_LEAD") {
      renderLeadDashboard(proj, use);
      return;
    }
    if (role === "ASST_EHS_MANAGER") {
      renderAssistantDashboard(proj, use);
      return;
    }
    if (role === "EHS_MANAGER") {
      renderManagerDashboard(stats, bp);
      return;
    }
    if (role === "DIRECTOR") {
      renderDirectorDashboard(stats, bp);
      return;
    }

    $("view").innerHTML =
      '<div class="grid kpi">' +
      kpi(use.pending, "Pending approvals") +
      kpi(use.approved, "Approved PDFs") +
      kpi(use.rejected, "Returned to lead") +
      kpi(use.openObs, "Open observations") +
      kpi(use.manHours, "Man hours") +
      kpi((use.compliance || 0) + "%", "Compliance") +
      "</div>" +
      roleDashboardPanel(role, proj, stats) +
      '<div class="charts" style="margin-top:14px">' +
      '<div class="card"><canvas id="c1"></canvas></div>' +
      '<div class="card"><canvas id="c2"></canvas></div>' +
      "</div>" +
      '<div class="grid mods" style="margin-top:14px">' +
      STATE.modules
        .map(
          (m) =>
            '<div class="card mod" onclick="openModule(\'' +
            m.id +
            '\')"><div class="pill">' +
            m.cadence +
            '</div><h3 style="margin:8px 0 4px">' +
            m.title +
            '</h3><p class="muted">Open forms & PDFs</p></div>',
        )
        .join("") +
      "</div>" +
      (proj
        ? '<div class="card" style="margin-top:14px">' +
          projectInfo(proj) +
          "</div>"
        : projectTable()) +
      '<div class="card" style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn small" onclick="exportNow(\'pdf\')">Download report PDF</button>' +
      '<button class="btn small secondary" onclick="exportNow(\'xlsx\')">Download Excel</button>' +
      "</div>";

    const labels = Object.keys(bp).map((k) => bp[k].name);
    CHARTS.push(
      new Chart($("c1"), {
        type: "bar",
        data: {
          labels: labels,
          datasets: [
            {
              label: "Approved",
              data: Object.keys(bp).map((k) => bp[k].approved),
              backgroundColor: "#1f7a6b",
            },
            {
              label: "Pending",
              data: Object.keys(bp).map((k) => bp[k].pending),
              backgroundColor: "#e8b931",
            },
            {
              label: "Rejected",
              data: Object.keys(bp).map((k) => bp[k].rejected),
              backgroundColor: "#b42318",
            },
          ],
        },
        options: {
          plugins: { title: { display: true, text: "Submissions by project" } },
          responsive: true,
        },
      }),
    );
    CHARTS.push(
      new Chart($("c2"), {
        type: "doughnut",
        data: {
          labels: ["Open observations", "Closed / other"],
          datasets: [
            {
              data: [
                use.openObs,
                Math.max(
                  0,
                  (stats.openObservations || 0) === use.openObs ? 1 : 1,
                ),
              ],
              backgroundColor: ["#b54708", "#1f7a6b"],
            },
          ],
        },
        options: {
          plugins: { title: { display: true, text: "Observation load" } },
        },
      }),
    );
  }

  function renderLeadDashboard(project, stats) {
    const submissions = scopedSubs().slice().reverse();
    const returned = submissions.filter((s) => s.status === "REJECTED");
    const observations = STATE.observations.filter((o) => o.status === "OPEN" || o.status === "FALLBACK");
    $("view").innerHTML =
      '<div class="card dashboard-hero"><span class="pill">SITE OPERATIONS</span><h2>' + esc(project ? project.name : "Mapped Site") + '</h2><p class="muted">Site Lead workspace: Fill daily checklists, generate work permits, submit weekly reports, and correct any returned records.</p>' +
      '<div class="row-actions" style="display:flex;gap:8px;flex-wrap:wrap">' +
      '  <button class="btn small" onclick="go(\'daily\')">Daily Checklists (17)</button>' +
      '  <button class="btn small secondary" onclick="go(\'weekly\')">Weekly / Monthly Reports</button>' +
      '  <button class="btn small" onclick="go(\'permits\')">Work Permits (6)</button>' +
      '  <button class="ghost" onclick="go(\'dailylog\')">Daily Log Sheet (Slide 8)</button>' +
      '  <button class="ghost" onclick="go(\'observations\')">Daily Observations (Slide 9)</button>' +
      '  <button class="ghost" onclick="go(\'trackers\')">PPE / Scaffold Trackers</button>' +
      '  <button class="ghost" onclick="go(\'documents\')">Project PDF Library</button>' +
      '</div></div>' +
      '<div class="grid kpi" style="margin-top:14px">' +
      kpi(submissions.length, "Submitted records") +
      kpi((returned.length ? '<span style="color:#dc2626;font-weight:bold">' + returned.length + '</span>' : '0'), "Returned for correction") +
      kpi(observations.length, "Open site actions") +
      kpi((stats.compliance || 0) + "%", "Approved compliance") +
      '</div>' +
      '<div class="grid dashboard-columns" style="margin-top:14px">' +
      '  <div class="card"><h3>Needs your attention</h3>' +
      (returned.length
        ? returned.slice(0, 6).map((s) => {
            const comments = STATE.comments.filter((c) => c.entityId === s.id);
            const lastComment = comments.length ? comments[comments.length - 1].text : "Please review and correct the highlighted fields.";
            return (
              '<div class="feed-item" style="border-left:3px solid #dc2626;padding-left:10px;margin-bottom:10px">' +
              '<strong>' + esc(s.title || s.formCode) + '</strong>' +
              '<div class="muted">Returned ' + esc(displayDate(s.reviewedAt || "")) + '</div>' +
              '<div style="font-size:12px;color:#991b1b;background:#fef2f2;padding:6px 8px;border-radius:4px;margin:6px 0"><b>Manager note:</b> ' + esc(lastComment) + '</div>' +
              '<div style="display:flex;gap:6px">' +
              '  <button class="btn small" onclick="openForm(\'' + s.formCode + '\',\'' + s.id + '\')">Correct & Resubmit</button>' +
              (s.pdfFileId ? '<button class="ghost" onclick="openFile(\'' + s.pdfFileId + '\')">View PDF</button>' : '') +
              '</div></div>'
            );
          }).join("")
        : '<p class="muted">No returned forms. All submissions are current.</p>') +
      '  </div>' +
      '  <div class="card"><h3>Recent submissions</h3>' + dashboardSubmissionRows(submissions.slice(0, 7)) + '</div>' +
      '</div>' +
      '<div class="grid mods" style="margin-top:14px">' +
      '  <div class="card mod" onclick="go(\'daily\')"><div class="pill">DAILY / WEEKLY</div><h3>Checklists & Formats</h3><p class="muted">17 Standard machine & site inspection forms</p></div>' +
      '  <div class="card mod" onclick="go(\'permits\')"><div class="pill">HIGH RISK</div><h3>Work Permits</h3><p class="muted">Height, Hot Work, Night, Shaft, Lifting, General</p></div>' +
      '  <div class="card mod" onclick="go(\'weekly\')"><div class="pill">PERIODIC</div><h3>Weekly / Monthly Reports</h3><p class="muted">Structured EHS performance report submissions</p></div>' +
      '  <div class="card mod" onclick="go(\'dailylog\')"><div class="pill">SLIDE 8</div><h3>Daily Performance Log</h3><p class="muted">Manpower, Safe Hours, Inductions, TBT, Zero LTI</p></div>' +
      '  <div class="card mod" onclick="go(\'observations\')"><div class="pill">SLIDE 9</div><h3>Daily Observations</h3><p class="muted">Photo attachments, PMC recommendations, 24h timer</p></div>' +
      '  <div class="card mod" onclick="go(\'trackers\')"><div class="pill">SLIDES 10-13</div><h3>PPE & Scaffold Trackers</h3><p class="muted">PPE Stock Register, Scaffolding & Movement trackers</p></div>' +
      '  <div class="card mod" onclick="go(\'documents\')"><div class="pill">eLIBRARY</div><h3>Project PDF Library</h3><p class="muted">View & search all generated project PDFs</p></div>' +
      '</div>';
  }

  function renderAssistantDashboard(project, stats) {
    const submissions = scopedSubs().slice().reverse();
    const pending = submissions.filter((s) => s.status === "SUBMITTED" || s.status === "RESUBMITTED");
    $("view").innerHTML =
      '<div class="card dashboard-hero"><span class="pill">PROJECT CONTROL</span><h2>' + esc(project ? project.name : "Select a mapped project") + '</h2><p class="muted">Review your assigned project, approve/return submissions with comments, edit or delete records, and track site metrics.</p><div class="row-actions"><button class="btn small" onclick="go(\'inbox\')">Open approval queue</button><button class="ghost" onclick="go(\'documents\')">Project PDF library</button><button class="ghost" onclick="exportNow(\'xlsx\')">Export project Excel</button></div></div>' +
      '<div class="grid kpi" style="margin-top:14px">' + kpi(pending.length, "Awaiting review") + kpi(stats.approved || 0, "Approved records") + kpi(stats.rejected || 0, "Returned records") + kpi((stats.compliance || 0) + "%", "Project compliance") + '</div>' +
      '<div class="card" style="margin-top:14px"><h3>Approval queue (' + pending.length + ')</h3>' + dashboardSubmissionRows(pending.slice(0, 12), true) + '</div>' +
      '<div class="grid mods" style="margin-top:14px">' + ["WEEKLY", "PERMIT", "TEST_CERT", "EHS_DOCS", "LEGAL", "POLICY", "SWMS", "CHECKLIST"].map((id) => { const m = STATE.modules.find((x) => x.id === id); return '<div class="card mod" onclick="openModule(\'' + id + '\')"><div class="pill">' + esc(m ? m.cadence : "") + '</div><h3>' + esc(m ? m.title : id) + '</h3><p class="muted">Manage project records</p></div>'; }).join("") + '</div>';
  }

  function renderManagerDashboard(stats, byProject) {
    const pid = currentProjectId();
    if (pid) {
      const proj = STATE.projects.find((p) => p.id === pid);
      const s = byProject[pid] || {};

  function directorScorecardTable(projects, bp) {
    if (!projects.length) return '<p class="muted">No projects found for this region filter.</p>';
    let sumManpower = 0, sumSafeHours = 0, sumCumSafe = 0, sumPending = 0, sumOpen = 0, sumPermits = 0;
    const rows = projects.map((p) => {
      const s = bp[p.id] || {};
      const mp = Number(s.totalManpower || 0);
      const sh = Number(s.safeManHours || 0);
      const csh = Number(s.cumSafeManHours || 0);
      const pend = Number(s.pending || 0);
      const op = Number(s.openObs || 0);
      const perm = Number(s.permitTotal || 0);
      const comp = Number(s.compliance || 0);
      const adt = Number(s.auditPercent || 90);

      sumManpower += mp; sumSafeHours += sh; sumCumSafe += csh;
      sumPending += pend; sumOpen += op; sumPermits += perm;

      return (
        '<tr>' +
        '<td><strong>' + esc(p.name) + '</strong><br><small class="muted">' + esc(p.code) + '</small></td>' +
        '<td><span class="pill">' + esc(p.region || 'Bangalore') + '</span></td>' +
        '<td>' + esc(p.client || '—') + '</td>' +
        '<td>' + esc(p.pmc || '—') + '</td>' +
        '<td>' + esc(p.inCharge || '—') + '</td>' +
        '<td>' + mp + '</td>' +
        '<td>' + sh.toLocaleString('en-IN') + '</td>' +
        '<td><strong>' + csh.toLocaleString('en-IN') + '</strong></td>' +
        '<td>' + adt + '%</td>' +
        '<td>' + (op > 0 ? '<span class="badge-open-risk">' + op + '</span>' : '0') + '</td>' +
        '<td>' + pend + '</td>' +
        '<td>' + perm + '</td>' +
        '<td><strong>' + comp + '%</strong></td>' +
        '<td><button class="ghost" onclick="$(\'project-select\').value=\'' + esc(p.id) + '\';render()">Drill Down</button></td>' +
        '</tr>'
      );
    }).join('');

    return (
      '<div class="table-responsive-wrap"><table>' +
      '<thead><tr>' +
      '<th>Project</th><th>Region</th><th>Client</th><th>PMC</th><th>In-Charge</th><th>Manpower</th><th>Safe Hours</th><th>Cum. Safe Hours</th><th>Audit Score</th><th>Open Obs</th><th>Pending</th><th>Permits</th><th>Compliance</th><th>Action</th>' +
      '</tr></thead>' +
      '<tbody>' + rows +
      '<tr class="table-summary-row">' +
      '<td colspan="5"><strong>TOTAL / PORTFOLIO AGGREGATE</strong></td>' +
      '<td><strong>' + sumManpower + '</strong></td>' +
      '<td><strong>' + sumSafeHours.toLocaleString('en-IN') + '</strong></td>' +
      '<td><strong>' + sumCumSafe.toLocaleString('en-IN') + '</strong></td>' +
      '<td>—</td>' +
      '<td><strong>' + sumOpen + '</strong></td>' +
      '<td><strong>' + sumPending + '</strong></td>' +
      '<td><strong>' + sumPermits + '</strong></td>' +
      '<td><strong>' + avg(projects.map(p => (bp[p.id] || {}).compliance || 0)) + '%</strong></td>' +
      '<td></td>' +
      '</tr>' +
      '</tbody></table></div>'
    );

  function openBulkUpload(formCode) {
    if (!currentProjectId()) { alert("Select a project first."); return; }
    const def = STATE.catalog.find((form) => form.formCode === formCode);
    showModal('<button class="modal-close" type="button" aria-label="Close" onclick="hideModal()">×</button>' +
      '<h3>' + esc(def.title) + '</h3><p class="muted">Select one or more PDF files. Each filename becomes the document title.</p>' +
      '<form id="bulk-upload-form" class="form-grid"><div class="full"><label>PDF documents</label><input id="bulk-files" type="file" accept="application/pdf,.pdf" multiple required></div>' +
      '<div id="bulk-file-list" class="full muted">No files selected.</div>' +
      '<div class="full row-actions"><button class="btn small" type="submit">Upload selected files</button><button type="button" class="ghost" onclick="hideModal()">Cancel</button></div></form>');
    $("bulk-files").onchange = function () {
      const names = Array.from(this.files).map((file) => esc(file.name));
      $("bulk-file-list").innerHTML = names.length ? names.map((name) => '<div class="selected-file">' + name + '</div>').join("") : "No files selected.";
    };
    $("bulk-upload-form").onsubmit = async function (event) {
      event.preventDefault();
      const files = Array.from($("bulk-files").files || []);
      if (!files.length) return;
      try {
        for (const file of files) {
          const b64 = await blobToB64(file);
          const title = file.name.replace(/\.[^.]+$/, "");
          await run("apiUploadMeta", TOKEN, {
            projectId: currentProjectId(),
            kind: "LIBRARY",
            module: def.module,
            moduleTitle: def.title,
            title: title,
            fileName: file.name,
            mimeType: file.type || "application/pdf",
            base64: b64.split(",")[1],
            tags: formCode
          });
        }
        hideModal();
        await refresh();
      } catch (error) {
        alert(error.message || error);
      }
    };
  }

    if (form.entryType === "UPLOAD") {

  async function openForm(formCode, submissionId) {
    if (!currentProjectId()) {
      alert("Select a project first.");
      return;
    }
    const meta = await run("apiGetFormMeta", TOKEN, formCode);
    const prev = submissionId
      ? STATE.submissions.find((s) => s.id === submissionId)
      : null;
    const payload =
      prev && prev.payload && typeof prev.payload === "object"
        ? prev.payload
        : {};
    const fields = meta.fields
      .map((f) => {
        const val = payload[f.key] || "";
        let ctrl = "";
        if (f.type === "textarea")
          ctrl =
            '<textarea name="' +
            f.key +
            '" placeholder="Enter ' +
            esc(f.label.toLowerCase()) +
            '" ' +
            (f.required ? "required" : "") +
            ">" +
            esc(val) +
            "</textarea>";
        else if (f.type === "select")
          ctrl =
            '<select name="' +
            f.key +
            '" ' +
            (f.required ? "required" : "") +
            ">" +
            (f.options || [])
              .map(
                (o) =>
                  "<option " +
                  (o === val ? "selected" : "") +
                  ">" +
                  o +
                  "</option>",
              )
              .join("") +
            "</select>";
        else
          ctrl =
            '<input name="' +
            f.key +
            '" type="' +
            (f.type || "text") +
            '" lang="en-GB' +
            '" value="' +
            esc(val) +
            '" placeholder="Enter ' +
            esc(f.label.toLowerCase()) +
            '" ' +
            (f.required ? "required" : "") +
            ">";
        return (
          '<div class="' +
          (f.type === "textarea" ? "full" : "") +
          '"><label>' +
          esc(f.label) +
          "</label>" +
          ctrl +
          "</div>"
        );
      })
      .join("");
    const upload = meta.def.entryType === "UPLOAD";
    showModal(
      "<h3>" +
        esc(meta.def.title) +
        '</h3><p class="muted">' +
        esc(currentProject().name) +
        "</p>" +
        '<form id="dyn-form" class="form-grid">' +

        '<div class="full" style="display:flex;gap:8px"><button class="btn small" type="submit">Submit for approval</button><button type="button" class="ghost" onclick="hideModal()">Cancel</button></div></form>',
    );

      ev.preventDefault();
      const fd = new FormData(this);

      const fileEl = $("up-file");
      try {
        if (fileEl && fileEl.files[0]) {
          const file = fileEl.files[0];
          const b64 = await blobToB64(file);
          await run("apiUploadMeta", TOKEN, {
            projectId: currentProjectId(),
            kind: "LIBRARY",
            module: meta.def.module,
            moduleTitle: (
              STATE.modules.find((m) => m.id === meta.def.module) || {}
            ).title,
            title: obj.title || file.name,
            fileName: file.name,
            mimeType: file.type || "application/pdf",
            base64: b64.split(",")[1],
            tags: meta.def.formCode,
          });
        }
        const res = await run("apiSubmitForm", TOKEN, {
          projectId: currentProjectId(),
          formCode: formCode,
          fields: obj,
          submissionId: submissionId || "",
          requestId: window.crypto && window.crypto.randomUUID ? window.crypto.randomUUID() : "REQ_" + Date.now() + "_" + Math.random().toString(36).slice(2),
        });
        hideModal();
        alert("Submitted. PDF generated and sent up the approval chain.");
        await refresh();
      } catch (err) {
        alert(err.message || err);
      }
    };

    } else {
      comment = prompt("Optional comment") || "";
    }
    try {

      alert(e.message || e);

  function attachNotifSwipe(card, notif) {
    let startX = 0;
    let startY = 0;
    let isDragging = false;
    let hasMoved = false;
    let startTime = 0;

    function handleStart(clientX, clientY) {
      startX = clientX;
      startY = clientY;
      isDragging = false;
      hasMoved = false;
      startTime = Date.now();
      card.classList.remove('swiping');
    }

    function handleMove(clientX, clientY, e) {
      const dx = clientX - startX;
      const dy = clientY - startY;

      if (!isDragging && Math.abs(dy) > Math.abs(dx)) return;

      if (dx > 8) {
        if (e && e.cancelable) e.preventDefault();
        isDragging = true;
        hasMoved = true;
        card.classList.add('swiping');
        const clampedDx = Math.max(0, dx);
        const opacity = Math.max(0.15, 1 - (clampedDx / 320));
        card.style.transform = 'translateX(' + clampedDx + 'px)';
        card.style.opacity = opacity;
      }
    }

    function handleEnd(clientX) {
      if (isDragging) {
        card.classList.remove('swiping');
        const dx = clientX - startX;
        const elapsed = Math.max(1, Date.now() - startTime);
        const velocity = dx / elapsed;

        if (dx > 75 || (dx > 30 && velocity > 0.35)) {
          dismissNotif(notif.id, card);
        } else {
          card.style.transform = 'translateX(0px)';
          card.style.opacity = '1';
        }
        isDragging = false;
      } else if (!hasMoved) {
        onNotifTap(notif);
      }
    }

    card.addEventListener('touchstart', (e) => {
      if (e.touches && e.touches.length === 1) {
        handleStart(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    card.addEventListener('touchmove', (e) => {
      if (e.touches && e.touches.length === 1) {
        handleMove(e.touches[0].clientX, e.touches[0].clientY, e);
      }
    }, { passive: false });

    card.addEventListener('touchend', (e) => {
      const touch = e.changedTouches && e.changedTouches[0];
      handleEnd(touch ? touch.clientX : startX);
    });

    card.addEventListener('touchcancel', () => {
      isDragging = false;
      card.classList.remove('swiping');
      card.style.transform = 'translateX(0px)';
      card.style.opacity = '1';
    });

    let isMouseDown = false;
    card.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      isMouseDown = true;
      handleStart(e.clientX, e.clientY);

      function onMouseMove(me) {
        if (!isMouseDown) return;
        handleMove(me.clientX, me.clientY, me);
      }

      function onMouseUp(me) {
        if (!isMouseDown) return;
        isMouseDown = false;
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);
        handleEnd(me.clientX);
      }

      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
    });
  }

  function dismissNotif(notifId, card) {
    const wrap = $('notif-wrap-' + notifId) || (card ? card.parentElement : null);
    if (card) {
      card.style.transition = 'transform 0.28s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.28s ease';
      card.style.transform = 'translateX(120%)';
      card.style.opacity = '0';
    }
    setTimeout(() => {
      if (wrap) {
        wrap.classList.add('dismissing');
        setTimeout(() => {
          try { wrap.remove(); } catch (e) {}
          checkNotifsEmpty();
        }, 300);
      }
    }, 80);

    const n = (STATE.notifications || []).find(x => x.id === notifId);
    if (n) n.read = 'TRUE';
    updateNotifBadge();

    run('apiDismissNotification', TOKEN, notifId).catch(e => console.error(e));
  }
  window.dismissNotif = dismissNotif;

  async function clearAllNotifications() {
    const list = $('notif-list-container');
    if (!list) return;
    const cards = list.querySelectorAll('.notif-card');
    cards.forEach((c, idx) => {
      setTimeout(() => {
        c.style.transition = 'transform 0.25s ease, opacity 0.25s ease';
        c.style.transform = 'translateX(120%)';
        c.style.opacity = '0';
        const wrap = c.parentElement;
        if (wrap) wrap.classList.add('dismissing');
      }, idx * 35);
    });

    (STATE.notifications || []).forEach(n => { n.read = 'TRUE'; });
    updateNotifBadge();

    setTimeout(() => {
      list.innerHTML = '<div class="notif-empty-state"><div class="notif-empty-icon">✓</div><h4>All caught up!</h4><p class="muted">No active notifications</p></div>';
      const clearBtn = $('notif-clear-all-btn');
      if (clearBtn) clearBtn.style.display = 'none';
      const countBadge = $('notif-unread-count');
      if (countBadge) countBadge.textContent = '0';
    }, Math.min(cards.length * 35 + 200, 800));

    try {
      await run('apiClearAllNotifications', TOKEN);
    } catch (e) {
      console.error(e);
    }
  }
  window.clearAllNotifications = clearAllNotifications;

  function onNotifTap(notif) {
    if (!notif) return;
    notif.read = 'TRUE';
    updateNotifBadge();
    run('apiMarkRead', TOKEN, notif.id).catch(() => {});

    if (notif.projectId && notif.projectId !== '*') {
      const pSel = $('project-select');
      if (pSel && Array.from(pSel.options).some(o => o.value === notif.projectId)) {
        pSel.value = notif.projectId;
      }
    }

    const type = String(notif.type || '').toUpperCase();
    const title = String(notif.title || '').toLowerCase();
    let targetView = 'dashboard';

    if (type === 'APPROVAL' || title.indexOf('approval') >= 0 || title.indexOf('submitted') >= 0 || title.indexOf('pending') >= 0) {
      targetView = 'inbox';
    } else if (type === 'OBSERVATION' || type === 'ESCALATION' || title.indexOf('observation') >= 0 || title.indexOf('escalat') >= 0) {
      targetView = 'observations';
    } else if (type === 'GALLERY' || title.indexOf('gallery') >= 0) {
      targetView = 'gallery';
    } else if (type === 'TRAINING' || title.indexOf('training') >= 0) {
      targetView = 'calendar';
    } else if (type === 'PERMIT' || title.indexOf('permit') >= 0) {
      targetView = 'permits';
    } else if (type === 'DAILY' || title.indexOf('daily log') >= 0 || title.indexOf('dailylog') >= 0) {
      targetView = 'dailylog';
    } else if (type === 'PPE' || title.indexOf('ppe') >= 0) {
      targetView = 'trackers';
    } else if (type === 'AUDIT' || title.indexOf('audit') >= 0) {
      targetView = 'trackers';
    } else if (type === 'DOCUMENT' || title.indexOf('document') >= 0) {
      targetView = 'documents';
    }

    hideModal();
    go(targetView);
  }
  window.onNotifTap = onNotifTap;

  function checkNotifsEmpty() {
    const list = $('notif-list-container');
    if (!list) return;
    const remaining = list.querySelectorAll('.notif-wrapper:not(.dismissing)');
    if (remaining.length === 0) {
      list.innerHTML = '<div class="notif-empty-state"><div class="notif-empty-icon">✓</div><h4>All caught up!</h4><p class="muted">No active notifications</p></div>';
      const clearBtn = $('notif-clear-all-btn');
      if (clearBtn) clearBtn.style.display = 'none';
      const countBadge = $('notif-unread-count');
      if (countBadge) countBadge.textContent = '0';
    }
  }

  async function exportNow(fmt) {
    const pid =
      currentProjectId() || (STATE.projects[0] && STATE.projects[0].id);
    if (!pid) {
      alert("No project");
      return;
    }
    try {
      const res = await run("apiExportProject", TOKEN, pid, fmt);
      window.open(res.url, "_blank");
    } catch (e) {
      alert(e.message || e);
    }
  }

  async function openFile(fileId) {
    const res = await run("apiFileUrl", TOKEN, fileId);
    window.open(res.url, "_blank");
  }

  async function refresh() {
    const bootRes = await run("apiBootstrap", TOKEN);
    STATE = bootRes.data;
    USER = bootRes.user;
    render();
  }

  function showModal(html) {
    $("modal-card").innerHTML = html.indexOf("modal-close") >= 0 ? html : '<button class="modal-close" type="button" aria-label="Close" onclick="hideModal()">×</button>' + html;
    $("modal").hidden = false;
  }
  function hideModal() {
    $("modal").hidden = true;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(
      /[&<>"']/g,
      (c) =>
        ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[c],
    );
  }
  function blobToB64(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }

  if (TOKEN) {
    boot().catch(() => {
      sessionStorage.removeItem(TOKEN_KEY);
      TOKEN = "";
      initLoginCard();
    });
  } else {
    initLoginCard();
  }
</script>
