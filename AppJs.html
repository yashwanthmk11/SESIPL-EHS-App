<script>
  const TOKEN_KEY = "sesipl_ehs_token";
  let TOKEN = sessionStorage.getItem(TOKEN_KEY) || "";
  let USER = null;
  let STATE = null;
  let VIEW = "dashboard";
  let MODULE = null;
  let CHARTS = [];
  let MUTATION_IN_FLIGHT = false;
  const MUTATING_CALLS = new Set([
    "apiSubmitForm", "apiReview", "apiAddComment", "apiDeleteComment", "apiDeleteSubmission",
    "apiDeleteUploadedFile",
    "apiSaveDailyLog", "apiSavePpe", "apiSaveScaffold", "apiSaveMovement",
    "apiSaveObservation", "apiCloseObservation", "apiSaveTraining", "apiUploadMeta",
    "apiSaveUser", "apiCreateProject", "apiUpdateProject", "apiDeleteProject"
  ]);

  const ROLE_LABEL = {
    EHS_LEAD: "EHS Lead",
    ASST_EHS_MANAGER: "Asst EHS Manager",
    EHS_MANAGER: "EHS Manager",
    DIRECTOR: "Director",
  };

  function run(fn, ...args) {
    const isMutation = MUTATING_CALLS.has(fn);
    if (isMutation && MUTATION_IN_FLIGHT) {
      return Promise.reject(new Error("Please wait for the current action to finish."));
    }
    if (isMutation) {
      MUTATION_IN_FLIGHT = true;
      setLoading(true, "Saving securely...");
    }
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler((value) => {
          if (isMutation) finishMutation();
          if (value === null || value === undefined) {
            reject(new Error("Server returned an empty response for " + fn + ". Please verify Google Apps Script authorization or reload."));
            return;
          }
          resolve(value);
        })
        .withFailureHandler((error) => {
          if (isMutation) finishMutation();
          const msg = (error && error.message) ? error.message : (typeof error === "string" ? error : "Operation failed on server.");
          reject(new Error(msg));
        })
        [fn](...args);
    });
  }

  function finishMutation() {
    MUTATION_IN_FLIGHT = false;
    setLoading(false);
  }

  function setLoading(active, label) {
    const state = $("loading-state");
    if (!state) return;
    if (label) $("loading-label").textContent = label;
    state.hidden = !active;
    document.querySelectorAll("button").forEach((button) => {
      if (active) {
        button.dataset.wasDisabled = button.disabled ? "true" : "false";
        button.disabled = true;
      } else if (button.dataset.wasDisabled) {
        button.disabled = button.dataset.wasDisabled === "true";
        delete button.dataset.wasDisabled;
      }
    });
  }

  function $(id) { return document.getElementById(id); }

  function displayDate(value) {
    const text = String(value == null ? "" : value).trim();
    const match = text.match(/^(\d{4})-(\d{2})-(\d{2})(.*)$/);
    return match ? match[3] + "/" + match[2] + "/" + match[1] + match[4] : text;
  }

  function toggleUanVisibility() {
    const input = $("uan");
    const icon = $("uan-eye-icon");
    const btn = $("uan-toggle-btn");
    if (!input || !icon) return;
    const isPassword = input.type === "password";
    input.type = isPassword ? "text" : "password";
    const label = isPassword ? "Hide UAN" : "Show UAN";
    btn.setAttribute("aria-label", label);
    btn.title = label;
    if (isPassword) {
      icon.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
    } else {
      icon.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    }
    input.focus();
  }

  function openLoginHelp() {
    showModal(`
      <div class="login-help-dialog">
        <h3>Sign In Assistance</h3>
        <p class="muted" style="margin-bottom:16px;">Follow these guidelines to access your SESIPL EHS portal account:</p>
        <div class="login-help-step">
          <div class="login-help-badge">1</div>
          <div class="login-help-desc">
            <strong>Employee ID:</strong> Your assigned company ID code (e.g. <code>EMP001</code>, <code>EMP002</code>).
          </div>
        </div>
        <div class="login-help-step">
          <div class="login-help-badge">2</div>
          <div class="login-help-desc">
            <strong>UAN (PIN / Password):</strong> Your registered Universal Account Number credential as recorded in the master system.
          </div>
        </div>
        <div class="login-help-step">
          <div class="login-help-badge">3</div>
          <div class="login-help-desc">
            <strong>Need Account Activation?</strong> If you cannot sign in or your account is inactive, please contact your site EHS Manager or Administrator.
          </div>
        </div>
        <div style="margin-top:20px; text-align:right;">
          <button class="btn secondary small" onclick="hideModal()">Got it</button>
        </div>
      </div>
    `);
  }

  function initLoginCard() {
    const empInput = $("empId");
    const uanInput = $("uan");
    const rememberCheck = $("remember-emp-id");
    const savedEmp = localStorage.getItem("sesipl_remember_emp_id");

    if (savedEmp && empInput) {
      empInput.value = savedEmp;
      if (rememberCheck) rememberCheck.checked = true;
      if (uanInput && !$("login-screen").hidden) {
        setTimeout(() => uanInput.focus(), 150);
      }
    } else if (empInput && !$("login-screen").hidden) {
      setTimeout(() => empInput.focus(), 150);
    }

    if (empInput && !empInput.dataset.bound) {
      empInput.dataset.bound = "true";
      empInput.addEventListener("input", () => {
        empInput.value = empInput.value.toUpperCase();
      });
    }

    if (uanInput && !uanInput.dataset.bound) {
      uanInput.dataset.bound = "true";
      const checkCaps = (e) => {
        const warning = $("caps-warning");
        if (!warning) return;
        if (e.getModifierState && e.getModifierState("CapsLock")) {
          warning.hidden = false;
        } else {
          warning.hidden = true;
        }
      };
      uanInput.addEventListener("keyup", checkCaps);
      uanInput.addEventListener("keydown", checkCaps);
      uanInput.addEventListener("blur", () => {
        const warning = $("caps-warning");
        if (warning) warning.hidden = true;
      });
    }
  }

  async function doLogin(e) {
    if (e) e.preventDefault();
    const empIdEl = $("empId");
    const uanEl = $("uan");
    const errEl = $("login-err");
    const errTextEl = $("login-err-text");
    const btn = $("login-btn");
    const spinner = $("login-btn-spinner");
    const btnText = $("login-btn-text");
    const card = $("main-login-card") || document.querySelector(".login-card");

    if (errEl) errEl.hidden = true;

    const empId = (empIdEl ? empIdEl.value : "").trim();
    const uan = (uanEl ? uanEl.value : "").trim();

    if (!empId || !uan) {
      if (card) {
        card.classList.remove("shake");
        void card.offsetWidth;
        card.classList.add("shake");
      }
      if (errTextEl) errTextEl.textContent = "Please enter both Employee ID and UAN.";
      if (errEl) errEl.hidden = false;
      if (!empId && empIdEl) empIdEl.focus();
      else if (uanEl) uanEl.focus();
      return false;
    }

    btn.disabled = true;
    if (spinner) spinner.hidden = false;
    if (btnText) btnText.textContent = "Authenticating...";

    try {
      const res = await run("login", empId, uan);
      if (!res.ok) throw new Error(res.error || "Authentication failed.");

      const rememberCheck = $("remember-emp-id");
      if (rememberCheck && rememberCheck.checked) {
        localStorage.setItem("sesipl_remember_emp_id", empId);
      } else {
        localStorage.removeItem("sesipl_remember_emp_id");
      }

      TOKEN = res.token;
      sessionStorage.setItem(TOKEN_KEY, TOKEN);
      USER = res.user;
      if (btnText) btnText.textContent = "Entering Portal...";
      await boot();
    } catch (err) {
      if (card) {
        card.classList.remove("shake");
        void card.offsetWidth;
        card.classList.add("shake");
      }
      if (errTextEl) errTextEl.textContent = err.message || String(err);
      if (errEl) errEl.hidden = false;
      if (uanEl) {
        uanEl.focus();
        uanEl.select();
      }
    } finally {
      btn.disabled = false;
      if (spinner) spinner.hidden = true;
      if (btnText) btnText.textContent = "Sign In to Portal";
    }
    return false;
  }

  async function doLogout() {
    try {
      await run("logout", TOKEN);
    } catch (e) {}
    TOKEN = "";
    USER = null;
    STATE = null;
    sessionStorage.removeItem(TOKEN_KEY);
    $("app-screen").hidden = true;
    $("login-screen").hidden = false;
    if ($("uan")) $("uan").value = "";
    initLoginCard();
  }

  async function boot() {
    const bootRes = await run("apiBootstrap", TOKEN);
    if (!bootRes || !bootRes.ok || !bootRes.data) {
      const msg = (bootRes && bootRes.error) ? bootRes.error : "Failed to load dashboard data. Please try again.";
      await doLogout();
      throw new Error(msg);
    }
    STATE = bootRes.data;
    USER = bootRes.user || USER;
    if (STATE && STATE.notifications) {
      const dismissed = getDismissedNotifIds();
      STATE.notifications = STATE.notifications.filter(n => !dismissed.has(n.id) && String(n.dismissed || '').toUpperCase() !== 'TRUE');
    }
    $("login-screen").hidden = true;
    $("app-screen").hidden = false;
    $("who-name").textContent = USER.name;
    $("side-role").textContent = ROLE_LABEL[USER.role] || USER.role;
    fillProjects();
    buildNav();
    render();
  }

  function canManageProjects() {
    return USER && (USER.role === "DIRECTOR" || USER.role === "EHS_MANAGER" || USER.role === "ASST_EHS_MANAGER");
  }
  window.canManageProjects = canManageProjects;

  function fillProjects() {
    const sel = $("project-select");
    if (!sel) return;
    const prevVal = sel.value;
    sel.innerHTML = "";
    (STATE.projects || []).forEach((p) => {
      const o = document.createElement("option");
      o.value = p.id;
      o.textContent = (p.code || "PRJ") + " — " + (p.name || "Untitled");
      sel.appendChild(o);
    });
    if (USER.role === "EHS_LEAD") {
      sel.disabled = true;
      if (STATE.selectedProjectId) sel.value = STATE.selectedProjectId;
    } else {
      sel.disabled = false;
      if (USER.role === "EHS_MANAGER" || USER.role === "DIRECTOR") {
        const all = document.createElement("option");
        all.value = "";
        all.textContent = "All running projects";
        sel.insertBefore(all, sel.firstChild);
      }
      if (prevVal && Array.from(sel.options).some((o) => o.value === prevVal)) {
        sel.value = prevVal;
      } else if (sel.options.length > 0) {
        sel.selectedIndex = 0;
      }
    }
    sel.onchange = () => render();
  }

  function currentProjectId() {
    return $("project-select").value;
  }

  function currentProject() {
    const id = currentProjectId();
    return STATE.projects.find((p) => p.id === id) || null;
  }

  function scopedSubs() {
    const id = currentProjectId();
    return STATE.submissions.filter((s) => !id || s.projectId === id);
  }

  function buildNav() {
    const items = USER.role === "EHS_LEAD"
      ? [
          ["dashboard", "Dashboard"], ["daily", "Daily uploads"],
          ["weekly", "Weekly / Monthly"], ["permits", "Work permits"],
          ["onetime", "One-time docs"], ["observations", "Observations"],
          ["documents", "PDF library"], ["dailylog", "Daily log"],
          ["trackers", "PPE / Scaffold"], ["gallery", "Gallery"],
          ["library", "eLibrary"], ["calendar", "Training calendar"],
        ]
      : [
          ["dashboard", "Dashboard"], ["inbox", "Approvals"],
          ["daily", "Daily uploads"], ["weekly", "Weekly / Monthly"],
          ["permits", "Work permits"], ["onetime", "One-time docs"],
          ["observations", "Observations"], ["documents", "PDF library"],
          ["dailylog", "Daily log"], ["trackers", "PPE / Scaffold"],
          ["gallery", "Gallery"], ["library", "eLibrary"],
          ["calendar", "Training calendar"],
        ];
    if (canManageProjects())
      items.push(["projects", "Projects"]);
    if (USER.role === "EHS_MANAGER" || USER.role === "DIRECTOR")
      items.push(["users", "Users"]);
    $("nav").innerHTML = items
      .map(
        ([id, label]) =>
          '<button data-view="' +
          id +
          '" onclick="go(\'' +
          id +
          "')\">" +
          label +
          "</button>",
      )
      .join("");
  }

  function go(view) {
    VIEW = view;
    try { window.scrollTo(0, 0); } catch (_) {}
    render();
  }

  function destroyCharts() {
    CHARTS.forEach((c) => {
      try {
        c.destroy();
      } catch (e) {}
    });
    CHARTS = [];
  }

  function render() {
    destroyCharts();
    document
      .querySelectorAll("#nav button")
      .forEach((b) =>
        b.classList.toggle("active", b.getAttribute("data-view") === VIEW),
      );
    const unread = (STATE.notifications || []).filter(
      (n) => String(n.read) !== "TRUE",
    ).length;
    $("badge-n").textContent = unread;
    const map = {
      dashboard: renderDashboard,
      projects: renderProjects,
      inbox: renderInbox,
      daily: () =>
        renderModuleForms(["CHECKLIST"], "Daily / weekly checklists"),
      weekly: () => renderModuleForms(["WEEKLY"], "Weekly & monthly reports"),
      permits: () => renderModuleForms(["PERMIT"], "Work permits"),
      onetime: () =>
        renderModuleForms(
          ["TEST_CERT", "EHS_DOCS", "LEGAL", "POLICY", "SWMS"],
          "One-time project documents (Assistant Manager uploads; Lead view only)",
        ),
      observations: renderObservations,
      documents: renderDocuments,
      dailylog: renderDailyLog,
      trackers: renderTrackers,
      gallery: renderGallery,
      library: renderLibrary,
      calendar: renderCalendar,
      users: renderUsers,
    };
    (map[VIEW] || renderDashboard)();
  }

  function renderDashboard() {
    const pid = currentProjectId();
    const proj = currentProject();
    const role = USER.role;
    $("page-title").textContent =
      role === "DIRECTOR"
        ? "Director overview"
        : role === "EHS_MANAGER"
          ? "All projects monitor"
          : role === "ASST_EHS_MANAGER"
            ? proj
              ? proj.name + " overview"
              : "Select a project"
            : proj
              ? proj.name
              : "My site";
    $("page-sub").textContent =
      "Employee " + USER.employeeId + " · " + (ROLE_LABEL[role] || role);

    const stats = STATE.stats;
    const bp = stats.byProject || {};
    const use =
      pid && bp[pid]
        ? bp[pid]
        : {
            pending: stats.pendingApprovals,
            approved: stats.approved,
            rejected: stats.rejected,
            openObs: stats.openObservations,
            manHours: stats.manHours,
            compliance: avg(Object.keys(bp).map((k) => bp[k].compliance)),
          };

    if (role === "EHS_LEAD") {
      renderLeadDashboard(proj, use);
      return;
    }
    if (role === "ASST_EHS_MANAGER") {
      renderAssistantDashboard(proj, use);
      return;
    }
    if (role === "EHS_MANAGER") {
      renderManagerDashboard(stats, bp);
      return;
    }
    if (role === "DIRECTOR") {
      renderDirectorDashboard(stats, bp);
      return;
    }

    $("view").innerHTML =
      '<div class="grid kpi">' +
      kpi(use.pending, "Pending approvals") +
      kpi(use.approved, "Approved PDFs") +
      kpi(use.rejected, "Returned to lead") +
      kpi(use.openObs, "Open observations") +
      kpi(use.manHours, "Man hours") +
      kpi((use.compliance || 0) + "%", "Compliance") +
      "</div>" +
      roleDashboardPanel(role, proj, stats) +
      '<div class="charts" style="margin-top:14px">' +
      '<div class="card"><canvas id="c1"></canvas></div>' +
      '<div class="card"><canvas id="c2"></canvas></div>' +
      "</div>" +
      '<div class="grid mods" style="margin-top:14px">' +
      STATE.modules
        .map(
          (m) =>
            '<div class="card mod" onclick="openModule(\'' +
            m.id +
            '\')"><div class="pill">' +
            m.cadence +
            '</div><h3 style="margin:8px 0 4px">' +
            m.title +
            '</h3><p class="muted">Open forms & PDFs</p></div>',
        )
        .join("") +
      "</div>" +
      (proj
        ? '<div class="card" style="margin-top:14px">' +
          projectInfo(proj) +
          "</div>"
        : projectTable()) +
      '<div class="card" style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn small" onclick="exportNow(\'pdf\')">Download report PDF</button>' +
      '<button class="btn small secondary" onclick="exportNow(\'xlsx\')">Download Excel</button>' +
      "</div>";

    const labels = Object.keys(bp).map((k) => bp[k].name);
    CHARTS.push(
      new Chart($("c1"), {
        type: "bar",
        data: {
          labels: labels,
          datasets: [
            {
              label: "Approved",
              data: Object.keys(bp).map((k) => bp[k].approved),
              backgroundColor: "#1f7a6b",
            },
            {
              label: "Pending",
              data: Object.keys(bp).map((k) => bp[k].pending),
              backgroundColor: "#e8b931",
            },
            {
              label: "Rejected",
              data: Object.keys(bp).map((k) => bp[k].rejected),
              backgroundColor: "#b42318",
            },
          ],
        },
        options: {
          plugins: { title: { display: true, text: "Submissions by project" } },
          responsive: true,
        },
      }),
    );
    CHARTS.push(
      new Chart($("c2"), {
        type: "doughnut",
        data: {
          labels: ["Open observations", "Closed / other"],
          datasets: [
            {
              data: [
                use.openObs,
                Math.max(
                  0,
                  (stats.openObservations || 0) === use.openObs ? 1 : 1,
                ),
              ],
              backgroundColor: ["#b54708", "#1f7a6b"],
            },
          ],
        },
        options: {
          plugins: { title: { display: true, text: "Observation load" } },
        },
      }),
    );
  }

  function renderLeadDashboard(project, stats) {
    const submissions = scopedSubs().slice().reverse();
    const returned = submissions.filter((s) => s.status === "REJECTED");
    const observations = STATE.observations.filter((o) => o.status === "OPEN" || o.status === "FALLBACK");
    $("view").innerHTML =
      '<div class="card dashboard-hero"><span class="pill">SITE OPERATIONS</span><h2>' + esc(project ? project.name : "Mapped Site") + '</h2><p class="muted">Site Lead workspace: Fill daily checklists, generate work permits, submit weekly reports, and correct any returned records.</p>' +
      '<div class="row-actions" style="display:flex;gap:8px;flex-wrap:wrap">' +
      '  <button class="btn small" onclick="go(\'daily\')">Daily Checklists (17)</button>' +
      '  <button class="btn small secondary" onclick="go(\'weekly\')">Weekly / Monthly Reports</button>' +
      '  <button class="btn small" onclick="go(\'permits\')">Work Permits (6)</button>' +
      '  <button class="ghost" onclick="go(\'dailylog\')">Daily Log Sheet (Slide 8)</button>' +
      '  <button class="ghost" onclick="go(\'observations\')">Daily Observations (Slide 9)</button>' +
      '  <button class="ghost" onclick="go(\'trackers\')">PPE / Scaffold Trackers</button>' +
      '  <button class="ghost" onclick="go(\'documents\')">Project PDF Library</button>' +
      '</div></div>' +
      '<div class="grid kpi" style="margin-top:14px">' +
      kpi(submissions.length, "Submitted records") +
      kpi((returned.length ? '<span style="color:#dc2626;font-weight:bold">' + returned.length + '</span>' : '0'), "Returned for correction") +
      kpi(observations.length, "Open site actions") +
      kpi((stats.compliance || 0) + "%", "Approved compliance") +
      '</div>' +
      '<div class="grid dashboard-columns" style="margin-top:14px">' +
      '  <div class="card"><h3>Needs your attention</h3>' +
      (returned.length
        ? returned.slice(0, 6).map((s) => {
            const comments = STATE.comments.filter((c) => c.entityId === s.id);
            const lastComment = comments.length ? comments[comments.length - 1].text : "Please review and correct the highlighted fields.";
            return (
              '<div class="feed-item" style="border-left:3px solid #dc2626;padding-left:10px;margin-bottom:10px">' +
              '<strong>' + esc(s.title || s.formCode) + '</strong>' +
              '<div class="muted">Returned ' + esc(displayDate(s.reviewedAt || "")) + '</div>' +
              '<div style="font-size:12px;color:#991b1b;background:#fef2f2;padding:6px 8px;border-radius:4px;margin:6px 0"><b>Manager note:</b> ' + esc(lastComment) + '</div>' +
              '<div style="display:flex;gap:6px">' +
              '  <button class="btn small" onclick="openForm(\'' + s.formCode + '\',\'' + s.id + '\')">Correct & Resubmit</button>' +
              (s.pdfFileId ? '<button class="ghost" onclick="openFile(\'' + s.pdfFileId + '\')">View PDF</button>' : '') +
              '</div></div>'
            );
          }).join("")
        : '<p class="muted">No returned forms. All submissions are current.</p>') +
      '  </div>' +
      '  <div class="card"><h3>Recent submissions</h3>' + dashboardSubmissionRows(submissions.slice(0, 7)) + '</div>' +
      '</div>' +
      '<div class="grid mods" style="margin-top:14px">' +
      '  <div class="card mod" onclick="go(\'daily\')"><div class="pill">DAILY / WEEKLY</div><h3>Checklists & Formats</h3><p class="muted">17 Standard machine & site inspection forms</p></div>' +
      '  <div class="card mod" onclick="go(\'permits\')"><div class="pill">HIGH RISK</div><h3>Work Permits</h3><p class="muted">Height, Hot Work, Night, Shaft, Lifting, General</p></div>' +
      '  <div class="card mod" onclick="go(\'weekly\')"><div class="pill">PERIODIC</div><h3>Weekly / Monthly Reports</h3><p class="muted">Structured EHS performance report submissions</p></div>' +
      '  <div class="card mod" onclick="go(\'dailylog\')"><div class="pill">SLIDE 8</div><h3>Daily Performance Log</h3><p class="muted">Manpower, Safe Hours, Inductions, TBT, Zero LTI</p></div>' +
      '  <div class="card mod" onclick="go(\'observations\')"><div class="pill">SLIDE 9</div><h3>Daily Observations</h3><p class="muted">Photo attachments, PMC recommendations, 24h timer</p></div>' +
      '  <div class="card mod" onclick="go(\'trackers\')"><div class="pill">SLIDES 10-13</div><h3>PPE & Scaffold Trackers</h3><p class="muted">PPE Stock Register, Scaffolding & Movement trackers</p></div>' +
      '  <div class="card mod" onclick="go(\'documents\')"><div class="pill">eLIBRARY</div><h3>Project PDF Library</h3><p class="muted">View & search all generated project PDFs</p></div>' +
      '</div>';
  }

  function renderAssistantDashboard(project, stats) {
    const submissions = scopedSubs().slice().reverse();
    const pending = submissions.filter((s) => s.status === "SUBMITTED" || s.status === "RESUBMITTED");
    $("view").innerHTML =

  function directorScorecardTable(projects, bp) {
    if (!projects.length) return '<p class="muted">No projects found for this region filter.</p>';
    let sumManpower = 0, sumSafeHours = 0, sumCumSafe = 0, sumPending = 0, sumOpen = 0, sumPermits = 0;
    const rows = projects.map((p) => {
      const s = bp[p.id] || {};
      const mp = Number(s.totalManpower || 0);
      const sh = Number(s.safeManHours || 0);
      const csh = Number(s.cumSafeManHours || 0);
      const pend = Number(s.pending || 0);
      const op = Number(s.openObs || 0);
      const perm = Number(s.permitTotal || 0);
      const comp = Number(s.compliance || 0);
      const adt = Number(s.auditPercent || 90);

      sumManpower += mp; sumSafeHours += sh; sumCumSafe += csh;
      sumPending += pend; sumOpen += op; sumPermits += perm;

      return (
        '<tr>' +
        '<td><strong>' + esc(p.name) + '</strong><br><small class="muted">' + esc(p.code) + '</small></td>' +
        '<td><span class="pill">' + esc(p.region || 'Bangalore') + '</span></td>' +
        '<td>' + esc(p.client || '—') + '</td>' +
        '<td>' + esc(p.pmc || '—') + '</td>' +
        '<td>' + esc(p.inCharge || '—') + '</td>' +
        '<td>' + mp + '</td>' +
        '<td>' + sh.toLocaleString('en-IN') + '</td>' +
        '<td><strong>' + csh.toLocaleString('en-IN') + '</strong></td>' +
        '<td>' + adt + '%</td>' +
        '<td>' + (op > 0 ? '<span class="badge-open-risk">' + op + '</span>' : '0') + '</td>' +
        '<td>' + pend + '</td>' +
        '<td>' + perm + '</td>' +
        '<td><strong>' + comp + '%</strong></td>' +
        '<td><button class="ghost" onclick="$(\'project-select\').value=\'' + esc(p.id) + '\';render()">Drill Down</button></td>' +
        '</tr>'
      );
    }).join('');

    return (
      '<div class="table-responsive-wrap"><table>' +
      '<thead><tr>' +
      '<th>Project</th><th>Region</th><th>Client</th><th>PMC</th><th>In-Charge</th><th>Manpower</th><th>Safe Hours</th><th>Cum. Safe Hours</th><th>Audit Score</th><th>Open Obs</th><th>Pending</th><th>Permits</th><th>Compliance</th><th>Action</th>' +
      '</tr></thead>' +
      '<tbody>' + rows +
      '<tr class="table-summary-row">' +
      '<td colspan="5"><strong>TOTAL / PORTFOLIO AGGREGATE</strong></td>' +
      '<td><strong>' + sumManpower + '</strong></td>' +
      '<td><strong>' + sumSafeHours.toLocaleString('en-IN') + '</strong></td>' +
      '<td><strong>' + sumCumSafe.toLocaleString('en-IN') + '</strong></td>' +
      '<td>—</td>' +
      '<td><strong>' + sumOpen + '</strong></td>' +
      '<td><strong>' + sumPending + '</strong></td>' +
      '<td><strong>' + sumPermits + '</strong></td>' +
      '<td><strong>' + avg(projects.map(p => (bp[p.id] || {}).compliance || 0)) + '%</strong></td>' +
      '<td></td>' +
      '</tr>' +
      '</tbody></table></div>'
    );
  }

  async function openForm(formCode, submissionId) {
    if (!currentProjectId()) {
      alert("Select a project first.");
      return;
    }
    const meta = await run("apiGetFormMeta", TOKEN, formCode);
    const prev = submissionId
      ? STATE.submissions.find((s) => s.id === submissionId)
      : null;
    const payload =
      prev && prev.payload && typeof prev.payload === "object"
        ? prev.payload
        : {};
    const fields = meta.fields
      .map((f) => {
        const val = payload[f.key] || "";
        let ctrl = "";
        if (f.type === "textarea")
          ctrl =
            '<textarea name="' +
            f.key +
            '" placeholder="Enter ' +
            esc(f.label.toLowerCase()) +
            '" ' +
            (f.required ? "required" : "") +
            ">" +
            esc(val) +
            "</textarea>";
        else if (f.type === "select")
          ctrl =
            '<select name="' +
            f.key +
            '" ' +
            (f.required ? "required" : "") +
            ">" +
            (f.options || [])
              .map(
                (o) =>
                  "<option " +
                  (o === val ? "selected" : "") +
                  ">" +
                  o +
                  "</option>",
              )
              .join("") +
            "</select>";
        else
          ctrl =
            '<input name="' +
            f.key +
            '" type="' +
            (f.type || "text") +
            '" lang="en-GB' +
            '" value="' +
            esc(val) +
            '" placeholder="Enter ' +
            esc(f.label.toLowerCase()) +
            '" ' +
            (f.required ? "required" : "") +
            ">";
        return (
          '<div class="' +
          (f.type === "textarea" ? "full" : "") +
          '"><label>' +
          esc(f.label) +
          "</label>" +
          ctrl +
          "</div>"
        );
      })
      .join("");
    const upload = meta.def.entryType === "UPLOAD";
    showModal(
      "<h3>" +
        esc(meta.def.title) +
        '</h3><p class="muted">' +
        esc(currentProject().name) +
        "</p>" +
        '<form id="dyn-form" class="form-grid">' +
        fields +
        (upload
          ? '<div class="full"><label>File</label><input type="file" id="up-file"></div>'
          : "") +
        '<div class="full" style="display:flex;gap:8px"><button class="btn small" type="submit">Submit for approval</button><button type="button" class="ghost" onclick="hideModal()">Cancel</button></div></form>',
    );
    $("dyn-form").onsubmit = async function (ev) {
      ev.preventDefault();
      const fd = new FormData(this);
      const obj = {};
      fd.forEach((v, k) => (obj[k] = v));
      const fileEl = $("up-file");
      try {
        if (fileEl && fileEl.files[0]) {
          const file = fileEl.files[0];
          const b64 = await blobToB64(file);
          await run("apiUploadMeta", TOKEN, {
            projectId: currentProjectId(),
            kind: "LIBRARY",
            module: meta.def.module,
            moduleTitle: (
              STATE.modules.find((m) => m.id === meta.def.module) || {}
            ).title,
            title: obj.title || file.name,
            fileName: file.name,
            mimeType: file.type || "application/pdf",
            base64: b64.split(",")[1],
            tags: meta.def.formCode,
          });
        }
        const res = await run("apiSubmitForm", TOKEN, {
          projectId: currentProjectId(),
          formCode: formCode,
          fields: obj,
          submissionId: submissionId || "",
          requestId: window.crypto && window.crypto.randomUUID ? window.crypto.randomUUID() : "REQ_" + Date.now() + "_" + Math.random().toString(36).slice(2),
        });
        hideModal();
        alert("Submitted. PDF generated and sent up the approval chain.");
        await refresh();
      } catch (err) {
        alert(err.message || err);
      }
    };
  }

  /* =========================================================
     IMMERSIVE GALLERY LIGHTBOX VIEWER
     ========================================================= */
  let CURRENT_LIGHTBOX_ITEMS = [];
  let CURRENT_LIGHTBOX_INDEX = 0;

  function openGalleryLightbox(mediaId) {
    const pid = currentProjectId();
    const activeFilter = window.GALLERY_FILTER || "ALL";
    const searchQuery = String(window.GALLERY_SEARCH || "").trim().toLowerCase();

    const allScoped = (STATE.gallery || []).filter(
      (g) => !pid || g.projectId === pid,
    );

    CURRENT_LIGHTBOX_ITEMS = allScoped.filter((g) => {
      const matchCat = activeFilter === "ALL" || (g.category || "").toUpperCase() === activeFilter;
      if (!matchCat) return false;
      if (!searchQuery) return true;
      const t = String(g.title || "").toLowerCase();
      const u = String(g.uploadedBy || "").toLowerCase();
      return t.includes(searchQuery) || u.includes(searchQuery);
    });

    if (!CURRENT_LIGHTBOX_ITEMS.length) {
      CURRENT_LIGHTBOX_ITEMS = allScoped;
    }

    const idx = CURRENT_LIGHTBOX_ITEMS.findIndex(g => g.id === mediaId);
    CURRENT_LIGHTBOX_INDEX = idx >= 0 ? idx : 0;

    renderLightboxContent();

    window.addEventListener("keydown", handleLightboxKeydown);
  }
  window.openGalleryLightbox = openGalleryLightbox;

  function closeGalleryLightbox() {
    const lb = $("gal-lightbox-root");
    if (lb) lb.remove();
    window.removeEventListener("keydown", handleLightboxKeydown);
  }
  window.closeGalleryLightbox = closeGalleryLightbox;

  function handleLightboxKeydown(e) {
    if (e.key === "ArrowLeft") {
      e.preventDefault();
      navLightbox(-1);
    } else if (e.key === "ArrowRight") {
      e.preventDefault();
      navLightbox(1);

      closeGalleryLightbox();

  function navLightbox(delta) {
    if (!CURRENT_LIGHTBOX_ITEMS.length) return;
    CURRENT_LIGHTBOX_INDEX = (CURRENT_LIGHTBOX_INDEX + delta + CURRENT_LIGHTBOX_ITEMS.length) % CURRENT_LIGHTBOX_ITEMS.length;
    renderLightboxContent();
  }
  window.navLightbox = navLightbox;

  function renderLightboxContent() {
    const g = CURRENT_LIGHTBOX_ITEMS[CURRENT_LIGHTBOX_INDEX];
    if (!g) return;

    let existing = $("gal-lightbox-root");
    if (!existing) {
      existing = document.createElement("div");
      existing.id = "gal-lightbox-root";
      existing.className = "gal-lightbox-backdrop";
      document.body.appendChild(existing);
    }

    const proj = (STATE.projects || []).find(p => p.id === g.projectId);
    const projName = proj ? (proj.name || proj.code) : g.projectId;
    const cat = String(g.category || "EVENT").toUpperCase();
    const isVideo = (g.mimeType && g.mimeType.toLowerCase().includes("video")) || (g.title && g.title.toLowerCase().endsWith(".mp4"));

    let displaySrc = g.thumbUrl;
    if (!displaySrc) {
      if (g.fileId && !String(g.fileId).startsWith("http")) {
        displaySrc = 'https://drive.google.com/thumbnail?id=' + g.fileId + '&sz=w1600';
      } else if (g.url && String(g.url).startsWith("http")) {
        displaySrc = g.url;
      } else if (g.fileId && String(g.fileId).startsWith("http")) {
        displaySrc = g.fileId;
      }
    }

    const canDelete = USER.role === "DIRECTOR" || USER.role === "EHS_MANAGER" || g.uploadedBy === USER.employeeId;

    existing.innerHTML = 
      '<div class="gal-lightbox-topbar">' +
        '<div class="gal-lightbox-topbar-left">' +
          '<span class="pill">' + esc(cat) + '</span>' +
          '<span class="gal-lightbox-counter">Photo ' + (CURRENT_LIGHTBOX_INDEX + 1) + ' of ' + CURRENT_LIGHTBOX_ITEMS.length + '</span>' +
        '</div>' +
        '<div class="gal-lightbox-topbar-right">' +
          (g.url ? '<a href="' + esc(g.url) + '" target="_blank" class="gal-lightbox-btn"><span>Open in Drive</span> ↗</a>' : '') +
          (canDelete ? '<button type="button" class="gal-lightbox-btn" style="background:#dc2626;border-color:#ef4444" onclick="delUploadedFile(\'' + esc(g.fileId) + '\');closeGalleryLightbox()">Delete 🗑️</button>' : '') +
          '<button type="button" class="gal-lightbox-close-btn" onclick="closeGalleryLightbox()" aria-label="Close">✕</button>' +
        '</div>' +
      '</div>' +

      '<div class="gal-lightbox-body" onclick="if(event.target===this)closeGalleryLightbox()">' +
        (CURRENT_LIGHTBOX_ITEMS.length > 1 ? '<button type="button" class="gal-lightbox-nav-btn prev" onclick="navLightbox(-1)" aria-label="Previous">❮</button>' : '') +
        (isVideo
          ? '<video src="' + esc(g.url || displaySrc) + '" controls autoplay class="gal-lightbox-media"></video>'
          : '<img src="' + esc(displaySrc) + '" class="gal-lightbox-media" alt="' + esc(g.title) + '" onerror="handleGalleryImgError(this,\'' + esc(cat) + '\')">') +
        (CURRENT_LIGHTBOX_ITEMS.length > 1 ? '<button type="button" class="gal-lightbox-nav-btn next" onclick="navLightbox(1)" aria-label="Next">❯</button>' : '') +
      '</div>' +

      '<div class="gal-lightbox-caption">' +
        '<div>' +
          '<div class="gal-lightbox-caption-title">' + esc(g.title) + '</div>' +
          (projName ? '<div style="font-size:12px;color:#94a3b8;margin-top:2px">📍 ' + esc(projName) + '</div>' : '') +
        '</div>' +
        '<div class="gal-lightbox-caption-meta">' +
          '<span>📅 Uploaded ' + displayDate(g.uploadedAt) + '</span>' +
          '<span>👤 By ' + esc(g.uploadedBy || 'Safety Team') + '</span>' +
        '</div>' +
      '</div>';
  }

        btn.disabled = true;

      try {

        await run("apiUploadMeta", TOKEN, {

  function handleGalModalFileSelect(input) {
    if (!input || !input.files || !input.files[0]) return;
    const file = input.files[0];
    const preview = $("gal-modal-preview");
    if (preview && file.type.startsWith("image/")) {
      const reader = new FileReader();
      reader.onload = function(e) {
        preview.src = e.target.result;
        preview.style.display = "block";
      };
      reader.readAsDataURL(file);
    }
  }

  /* =========================================================
     NOTIFICATION PERSISTENCE & DISMISSAL ENGINE
     ========================================================= */
  function getDismissedNotifIds() {
    if (!USER || !USER.employeeId) return new Set();
    try {
      const raw = localStorage.getItem("sesipl_dismissed_notifs_" + USER.employeeId);
      if (raw) {
        const arr = JSON.parse(raw);
        if (Array.isArray(arr)) return new Set(arr);
      }
    } catch (e) {}
    return new Set();
  }

  function markNotifDismissedLocal(notifId) {
    if (!USER || !USER.employeeId || !notifId) return;
    try {
      const set = getDismissedNotifIds();
      set.add(notifId);
      localStorage.setItem("sesipl_dismissed_notifs_" + USER.employeeId, JSON.stringify(Array.from(set).slice(-500)));
    } catch (e) {}
  }

  function markAllNotifsDismissedLocal(ids) {
    if (!USER || !USER.employeeId || !ids || !ids.length) return;
    try {
      const set = getDismissedNotifIds();
      ids.forEach(id => set.add(id));
      localStorage.setItem("sesipl_dismissed_notifs_" + USER.employeeId, JSON.stringify(Array.from(set).slice(-500)));
    } catch (e) {}
  }

  function getActiveNotifications() {
    const dismissed = getDismissedNotifIds();
    return (STATE && STATE.notifications ? STATE.notifications : []).filter(
      (n) => !dismissed.has(n.id) && String(n.dismissed || "").toUpperCase() !== "TRUE"
    );
  }

  function updateNotifBadge() {
    const active = getActiveNotifications();
    const unread = active.filter((n) => String(n.read) !== "TRUE").length;
    const b = $("badge-n");
    if (b) b.textContent = unread;
    const tb = $("notif-unread-count");
    if (tb) tb.textContent = unread;
  }

    const unreadCount = items.filter(n => String(n.read) !== "TRUE").length;
    const projectMap = {};

        const isUnread = String(n.read) !== 'TRUE';

  function attachNotifSwipe(card, notif) {
    let startX = 0;
    let startY = 0;
    let isDragging = false;
    let hasMoved = false;
    let startTime = 0;

    function handleStart(clientX, clientY) {
      startX = clientX;
      startY = clientY;
      isDragging = false;
      hasMoved = false;
      startTime = Date.now();
      card.classList.remove('swiping');
    }

    function handleMove(clientX, clientY, e) {
      const dx = clientX - startX;
      const dy = clientY - startY;

      if (!isDragging && Math.abs(dy) > Math.abs(dx)) return;

      if (dx > 8) {
        if (e && e.cancelable) e.preventDefault();
        isDragging = true;
        hasMoved = true;
        card.classList.add('swiping');
        const clampedDx = Math.max(0, dx);
        const opacity = Math.max(0.15, 1 - (clampedDx / 320));
        card.style.transform = 'translateX(' + clampedDx + 'px)';
        card.style.opacity = opacity;
      }
    }

    function handleEnd(clientX) {
      if (isDragging) {
        card.classList.remove('swiping');
        const dx = clientX - startX;
        const elapsed = Math.max(1, Date.now() - startTime);
        const velocity = dx / elapsed;

        if (dx > 75 || (dx > 30 && velocity > 0.35)) {
          dismissNotif(notif.id, card);
        } else {
          card.style.transform = 'translateX(0px)';
          card.style.opacity = '1';
        }
        isDragging = false;
      } else if (!hasMoved) {
        onNotifTap(notif);
      }
    }

    card.addEventListener('touchstart', (e) => {
      if (e.touches && e.touches.length === 1) {
        handleStart(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    card.addEventListener('touchmove', (e) => {
      if (e.touches && e.touches.length === 1) {
        handleMove(e.touches[0].clientX, e.touches[0].clientY, e);
      }
    }, { passive: false });

    card.addEventListener('touchend', (e) => {
      const touch = e.changedTouches && e.changedTouches[0];
      handleEnd(touch ? touch.clientX : startX);
    });

    card.addEventListener('touchcancel', () => {
      isDragging = false;
      card.classList.remove('swiping');
      card.style.transform = 'translateX(0px)';
      card.style.opacity = '1';
    });

    let isMouseDown = false;
    card.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      isMouseDown = true;
      handleStart(e.clientX, e.clientY);

      function onMouseMove(me) {
        if (!isMouseDown) return;
        handleMove(me.clientX, me.clientY, me);
      }

      function onMouseUp(me) {
        if (!isMouseDown) return;
        isMouseDown = false;
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);
        handleEnd(me.clientX);
      }

      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
    });
  }

  function dismissNotif(notifId, card) {
    // 1. Persist dismissed ID locally so it never appears again
    markNotifDismissedLocal(notifId);

    // 2. Remove from active state immediately
    if (STATE && STATE.notifications) {
      STATE.notifications = STATE.notifications.filter(x => x.id !== notifId);
    }
    updateNotifBadge();

    // 3. Smooth animated dismissal
    const wrap = $('notif-wrap-' + notifId) || (card ? card.parentElement : null);
    if (card) {
      card.style.transition = 'transform 0.28s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.28s ease';
      card.style.transform = 'translateX(120%)';
      card.style.opacity = '0';
    }
    setTimeout(() => {
      if (wrap) {
        wrap.classList.add('dismissing');
        setTimeout(() => {
          try { wrap.remove(); } catch (e) {}
          checkNotifsEmpty();
        }, 300);
      }
    }, 80);

    // 4. Record dismissal in Google Sheets
    run('apiDismissNotification', TOKEN, notifId).catch(e => console.warn('apiDismissNotification sync: ', e));
  }
  window.dismissNotif = dismissNotif;

  async function clearAllNotifications() {
    const list = $('notif-list-container');
    if (!list) return;

    const active = getActiveNotifications();
    const ids = active.map(n => n.id);

    // 1. Persist all IDs in localStorage immediately
    markAllNotifsDismissedLocal(ids);

    // 2. Remove all from active state immediately
    if (STATE && STATE.notifications) {
      STATE.notifications = STATE.notifications.filter(n => !ids.includes(n.id));
    }
    updateNotifBadge();

    // 3. Staggered card swipe-out animation
    const cards = list.querySelectorAll('.notif-card');
    cards.forEach((c, idx) => {
      setTimeout(() => {
        c.style.transition = 'transform 0.25s ease, opacity 0.25s ease';
        c.style.transform = 'translateX(120%)';
        c.style.opacity = '0';
        const wrap = c.parentElement;
        if (wrap) wrap.classList.add('dismissing');
      }, idx * 25);
    });

    // 4. Render clean empty state
    setTimeout(() => {
      list.innerHTML = '<div class="notif-empty-state"><div class="notif-empty-icon">✓</div><h4>All caught up!</h4><p class="muted">No active notifications</p></div>';

      const countBadge = $('notif-unread-count');
      if (countBadge) countBadge.textContent = '0';
    }, Math.min(cards.length * 25 + 150, 600));

    // 5. Tell server in background
    try {
      await run('apiClearAllNotifications', TOKEN);
    } catch (e) {
      console.warn('apiClearAllNotifications sync: ', e);
    }
  }

    if (STATE && STATE.notifications) {

  function timeAgo(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return String(iso);
      const diffSec = Math.floor((Date.now() - d.getTime()) / 1000);
      if (diffSec < 45) return "Just now";
      if (diffSec < 3600) return Math.floor(diffSec / 60) + "m ago";
      if (diffSec < 86400) return Math.floor(diffSec / 3600) + "h ago";
      if (diffSec < 172800) return "Yesterday at " + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      return d.toLocaleDateString([], { day: '2-digit', month: 'short' }) + " " + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    } catch (e) {
      return String(iso);
    }
  }

  function getRoleTheme(role) {
    const r = String(role || "").toUpperCase();
    if (r === "DIRECTOR") {
      return { bg: "#eef2ff", color: "#4338ca", border: "#c7d2fe", label: "DIRECTOR" };
    }
    if (r === "EHS_MANAGER") {
      return { bg: "#f0fdfa", color: "#0f766e", border: "#99f6e4", label: "EHS MANAGER" };
    }
    if (r === "ASST_EHS_MANAGER") {
      return { bg: "#f0f9ff", color: "#0369a1", border: "#bae6fd", label: "ASST MANAGER" };
    }
    if (r === "EHS_LEAD") {
      return { bg: "#fffbeb", color: "#b45309", border: "#fde68a", label: "EHS LEAD" };
    }
    return { bg: "#f1f5f9", color: "#475569", border: "#cbd5e1", label: role || "TEAM" };
  }

  function getInitials(name) {
    const parts = String(name || "").trim().split(/\s+/);
    if (!parts.length || !parts[0]) return "??";
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  function formatCommentText(raw) {
    let s = esc(raw);
    s = s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
    s = s.replace(/(@[A-Za-z0-9_]+)/g, '<span class="comment-mention">$1</span>');
    return s;
  }

  window.submitComment = async function(entityType, entityId, projectId) {
    const ta = $('new-comment-textarea');
    if (!ta) return;
    const text = ta.value.trim();
    if (!text) {
      ta.focus();
      return;
    }

    const bCheck = $('comment-broadcast-check');
    const isBroadcast = bCheck && bCheck.checked;

    const btn = $('post-comment-btn');
    if (btn) btn.disabled = true;
    ta.value = '';

    const tempId = 'tmp_' + Date.now();
    const optComment = {
      id: tempId,
      entityType: entityType,
      entityId: entityId,
      projectId: projectId,
      byEmployeeId: USER.employeeId,
      byName: USER.name,
      role: USER.role,
      text: text,
      createdAt: new Date().toISOString(),
      broadcast: isBroadcast ? 'TRUE' : 'FALSE'
    };

    if (!STATE.comments) STATE.comments = [];
    STATE.comments.push(optComment);

    const timeline = $('comments-timeline-container');
    const emptyPlaceholder = $('comments-empty-placeholder');
    if (emptyPlaceholder) emptyPlaceholder.remove();

    if (timeline) {
      const cardHtml = renderCommentCard(optComment, entityType, entityId);
      const div = document.createElement('div');
      div.innerHTML = cardHtml;
      if (div.firstElementChild) {
        timeline.appendChild(div.firstElementChild);
        timeline.scrollTop = timeline.scrollHeight;
      }
    }

    const countBadge = $('comment-thread-count');
    if (countBadge) {
      countBadge.textContent = parseInt(countBadge.textContent || '0', 10) + 1;
    }

    try {
      const res = await run("apiAddComment", TOKEN, {
        entityType: entityType,
        entityId: entityId,
        projectId: projectId,
        text: text,
        broadcast: isBroadcast
      });
      if (res && res.comment && res.comment.id) {
        optComment.id = res.comment.id;
        const domCard = $('comment-card-' + tempId);
        if (domCard) domCard.id = 'comment-card-' + res.comment.id;
      }
    } catch (err) {
      alert("Failed to save comment: " + (err && err.message ? err.message : err));
    } finally {
      if (btn) btn.disabled = false;
    }
  };

          '</div>' +
          (!isApprove ? 
            '<div class="review-reasons-wrap">' +
              '<div class="review-reasons-title">Quick Rejection Reason Presets:</div>' +
              '<div class="review-reasons-grid">' + presetHtml + '</div>' +
            '</div>' : '') +
          '<div class="review-comment-box">' +
            '<label for="review-comment-input">' + (isApprove ? 'Optional Review Remarks / Compliance Notes:' : 'Return Remarks to Lead (Required):') + '</label>' +
            '<textarea id="review-comment-input" class="comments-textarea" placeholder="' + (isApprove ? 'Enter any commendations or approval notes...' : 'Explain the defects or missing items that must be corrected before approval...') + '">' + esc(commentText || '') + '</textarea>' +
          '</div>' +
          '<div class="review-actions-bar">' +
            '<button type="button" class="ghost" onclick="hideModal()">Cancel</button>' +
            '<button type="button" id="review-submit-btn" class="btn small ' + (isApprove ? '' : 'danger') + '" onclick="submitReviewSignoff(\'' + esc(id) + '\')">' +
              (isApprove ? 'Confirm Approval' : 'Confirm Return') +
            '</button>' +
          '</div>' +
        '</div>'
      );
    }

    window.setReviewAction = function(act) {
      currentAction = act;
      const ta = $('review-comment-input');
      const text = ta ? ta.value : '';
      showModal(getModalHtml(currentAction, text));
    };

    window.selectReviewPreset = function(preset) {
      const ta = $('review-comment-input');
      if (ta) {
        ta.value = preset;
        ta.focus();
      }
    };

    window.submitReviewSignoff = async function(subId) {
      const ta = $('review-comment-input');
      const comment = ta ? ta.value.trim() : '';
      if (currentAction === "REJECT" && !comment) {
        alert("A review comment is required when returning a submission.");
        if (ta) ta.focus();
        return;
      }
      const btn = $('review-submit-btn');
      if (btn) {
        btn.disabled = true;
        btn.textContent = "Submitting...";
      }
      try {
        await run("apiReview", TOKEN, subId, currentAction, comment);
        hideModal();
        await refresh();
      } catch (e) {
        alert((e && e.message) ? e.message : e);
        if (btn) {
          btn.disabled = false;
          btn.textContent = currentAction === "APPROVE" ? "Confirm Approval" : "Confirm Return";
        }
      }
    };

    showModal(getModalHtml(currentAction, ""));
  }
  window.openReviewModal = openReviewModal;

  async function exportNow(fmt) {
    const pid =
      currentProjectId() || (STATE.projects[0] && STATE.projects[0].id);
    if (!pid) {
      alert("No project");
      return;
    }
    try {
      const res = await run("apiExportProject", TOKEN, pid, fmt);
      window.open(res.url, "_blank");
    } catch (e) {
      alert(e.message || e);
    }
  }

  async function openFile(fileId) {
    const res = await run("apiFileUrl", TOKEN, fileId);
    window.open(res.url, "_blank");
  }

  async function refresh() {
    try {
      const bootRes = await run("apiBootstrap", TOKEN);
      if (!bootRes || !bootRes.ok || !bootRes.data) {
        await doLogout();
        return;
      }
      STATE = bootRes.data;
      USER = bootRes.user;
      if (STATE && STATE.notifications) {
        const dismissed = getDismissedNotifIds();
        STATE.notifications = STATE.notifications.filter(n => !dismissed.has(n.id) && String(n.dismissed || '').toUpperCase() !== 'TRUE');
      }
      fillProjects();
      buildNav();
      render();
    } catch (e) {
      await doLogout();
    }
  }

  function showModal(html) {
    $("modal-card").innerHTML = html.indexOf("modal-close") >= 0 ? html : '<button class="modal-close" type="button" aria-label="Close" onclick="hideModal()">×</button>' + html;
    $("modal").hidden = false;
  }
  function hideModal() {
    $("modal").hidden = true;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(
      /[&<>"']/g,
      (c) =>
        ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[c],
    );
  }
  function blobToB64(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }

  if (TOKEN) {
    boot().catch(() => {
      sessionStorage.removeItem(TOKEN_KEY);
      TOKEN = "";
      initLoginCard();
    });
  } else {
    initLoginCard();
  }
</script>
